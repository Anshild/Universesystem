                (114)
                `,
                $t1 =='253'?`在内心中，你的理智开始动摇。但你发出刺耳的低吼，命令学生不要看。
                飞行的恐怖降临到峡谷中。它们折叠着膜状的翅膀，用四肢靠后面的一双腿向后立起，开始和小灰矮人一起围着光辉跳舞。一个真菌样的生物和那老妇人从舞蹈中分离出来，前者拿出一个盒子。它从老妇那里接过头颅，放进容器里。短暂操作后，异型生物走到一边。伯纳德的头从光辉中露出，眼睛在眨!他的嘴唇，他的下巴在动。就好像伯纳德恢复意识了，试图尖叫，但没有肺部和声带发出声音。
                这些怪物甚至偷走了伯纳德的死亡后的安宁。获得2点克苏鲁神话知识。进行一次理智检定：如果失败，则失去1D6 SC。然后，转到[250]。
                (173,249)
                `,
                $t1 =='254'?`改变位置时，你们中的一人碰到了灌木丛，导致其摇晃起来。下面的舞蹈停止了。其中一个小人直接指向你们藏身之处。他叫喊着什么,导致那些会飞的甲壳类生物逃到了树林里。而其他舞蹈者掏出了武器。你拉着学生赶紧躲避。
                转至[247]。
                (203)
                `,
                $t1 =='255'?`老太婆靠得很近，凝视着你的眼睛。“你是一个适合我精华的外壳。准备好她，我的孩子们。”
                小灰矮人把你的手腕和脚踝绑在地上的木桩上。其中一个迫使你用粘土烧杯喝酒。那种酒让你感觉很轻，很沉迷。你变得对周围的人毫不关心，他们拿着粗糙的蜡烛，叽叽喳喳，念念有词。
                \f老妇人大声地咕哝着，跪在你的头后面。她把爪子般的手指放在你的太阳穴上，大声祈祷。“奈亚拉托提普万岁!透特万岁!伊塔库亚万岁!意识消失吧!”
                你无忧无虑的心情突然消失了。女祭司的念词让你感觉就像你头颅里有东西在抓挠和污染你的脑浆。她打算渗透并取代你。
                这个老妇的POW是90。用你的POW做一次技能对抗：如果你赢了，转到[256];如果基瓦内马女王获胜，请转到[259]。
                (210)
                `,
                $t1 =='256'?`突然，对你意识的攻击停止了。你听到女巫的喘息，她倒在你身后的地上。诵念声停止了。营地里一片寂静。他们不再保持圆圈，而聚集到老妇人身边。
                基瓦内马女王费力地和他们商量着。几分钟后，他们把失去知觉的女王抱起来带走，把你和学生都捆着留在这里。
                转到[257]。
                (255)
                `,
                $t1 =='257'?`救援无望。你们中一人必须挣脱捆绑。
                为每个成员进行困难DEX检定。如果有人成功了，你们都会被解救；转到[224]。如果每个人都失败了，转到[258]。
                (256,261)
                `,
                $t1 =='258'?`在黑暗中的数小时里，不幸的你们一直和绳结作着斗争。大约午夜时分，当朦胧的月亮升至夜空正中时，森林里的野兽们靠近了你们。你提醒学生，野生动物袭击人类的报道很少。
                当然也没有人会听说这次袭击。纳德尔曼的远征结束了。【剧终】。
                (257,563)
                `,
                $t1 =='259'?`突然之间，没有了挣扎，只剩下团结。你尽可能地把头转过去。这位老太婆躺在你身后的地上，毫无生气。你冷笑。她很虚弱，丑陋。但你年轻，充满活力，充满力量。
                \f“Ipsdrib tpofout!”你嘶嘶地说。充满力量的话语把捆绑你的皮带变成了灰烬，你站起来。峡谷中的矮人们正聚精会神地站着。他们恭敬地鞠躬，将额头埋在尘土中。你回头看了一眼被束缚的诺曼和西尔维娅，他们惊恐又目瞪口呆地看着你。
                你的思想一时混乱。学术的荣耀和新英格兰社会生活的画面与异教徒的狂热和神灵在无尽森林中行走的画面交织在一起。你挺直肩膀。长久以来的规则，这个呸呜一族必须对比他们更伟大、更年长的人效忠，而你是他们不朽的女王兼祭司。
                慢慢地、故意地，你脱掉衣服，然后穿上你那已故前任以前穿的鹿皮。你指向俘虏学生，但面对着呸呜们讲话。“切掉这个，”你点头，意思是，“砍掉他们的头。”
                纳德尔曼的远征结束了。【剧终】。
                (255)
                `,
                $t1 =='260'?`老太婆向西尔维娅伸出了一根利爪般的手指。“那个女孩的身体将是我灵魂的容器，”老太婆得意洋洋道。“准备好她!”呸呜把西尔维娅拖到了一个地方，那里有四根木桩被打入了地下。她被捆住了，在木桩之间呈鹰状散开。你努力挣扎，但毫无希望。
                \f呸呜强迫西尔维娅从一个粘土烧杯中喝了什么,这似乎让她陷入了迷醉状态。灰色的小矮人聚集在她周围，抑扬顿挫地叽叽喳喳，小拳头内侧是些粗糙的脂肪纤维。老妇人祭司跪在西尔维娅身后，抓住女孩的太阳穴，开始祈祷。“奈亚拉托提普万岁!透特万岁!伊塔库亚万岁!意识消失吧!“当老妇人跪下时，她的身体颤抖。西尔维娅的脸上露出恐怖的表情。古代女巫和年轻女子之间发生了某种心灵较量。
                基瓦内马女王的POW为90。使用西尔维娅的POW进行对抗检定。如果西尔维娅在这场较量中获胜，转到[261]。如果她失败，转到[262]。
                (210)
                `,
                $t1 =='261'?`较量突然结束。女巫瘫倒在地。当矮人停止吟唱后，其中一人急忙去搀扶这位老妇人。她躺着不动。你甚至无法判断她是否在呼吸。
                呸呜围着他们丑陋的王后，把她抱起来。他们带着她匆匆离开，把你们三个留在峡谷里，仍然被束缚着，但无人看守。
                转到[257]。
                (260)
                `,
                $t1 =='262'?`西尔维娅和老妇人之间的较量突然结束了。当女巫摔倒在地时，你猜想西尔维娅赢了。
                但随后她说了一句奇怪的话，"Ipsdribtpofut!”一股超凡脱俗的火焰把她的捆绳烧成了粉末。她站了起来。从表面上看，她似乎没有改变。但西尔维娅特有的严肃性已经被磨灭了。她的动作和你们认识几个月的西尔维娅完全不同。女巫的魔法已经占据了她。她慢慢地、故意地脱掉衣服，然后把自己裹在她已故前任以前穿的鹿皮里。
                小矮人们在女孩赤裸的脚前匍匐在地上。她接受了他们的敬意，然后对你和诺曼使了一个眼神。她用一种不知名的语言下达命令。
                掷1D10:如果结果是偶数，转到[263];如果结果是奇数，转到[265]。
                (260)
                `,
                $t1 =='263'?`矮人们把你从峡谷带到一个孤独的地方。这里，一块犬齿石矗立在多节的常青树下，上面有雕刻和绘画符号。他们把你绑在岩石上，开始围着你转，他们的骨头装饰发出令人不悦的节奏。几个人对一个似乎是老旧壁炉的地方大喊大叫。一股炽热的蒸汽从那里袅袅升起，盘旋成一团紧密而耀眼的物质。
                当矮人们欢跃时，他们向天空发出欣喜若狂的呼喊。你抬头一看。迷雾已经散去，你可以奇怪地清晰地看到金牛座头上的毕宿星。冷风蹂躏着你的脸。你瑟瑟发抖，你感觉到天空——一瞬间的可怕虚无——正在向你袭来。
                令人费解的是，他们切断了你的绳子并逃走了。你跪在那巨石下面。
                转到[264]。
                (117、211、262)
                `,
                $t1 =='264'?`纳德尔曼!纳德尔曼!狂风在你耳边低语。伴随着声音而来的是一种奔向源头的冲动，以某种方式触摸冬日的天空。你迫切地想要与上空的任何东西融合。呼唤中有一个提议：成为比生命更狂野的存在，战胜死亡的死亡，超越不朽的改变。
                呼唤的POW为4D6+60。要抵抗它，请进行一次POW对抗检定：如果成功，请转到[39];如果你失败了，或者你不想反抗，那转到[215]。
                (72,263,455)
                `,
                $t1 =='265'?`矮小的灰人战士抓住你，将你拖走。他们强迫你跪在两棵小桦树之间，并各将一只手腕绑在每个树上。当一个人走近时，恐惧在你的胸腔里堆积，那是一把月牙形状的镰刀。吟唱开始，你环顾四周。从你的眼角，你看到了刀刃的闪光。冰冷的疼痛灼伤了你的喉咙。然后，黑暗降临。
                转到[417]。
                (117、211、262)
                `,
                $t1 =='266'?`一种难以置信的意志力的仪式已经在你身上释放了恶魔，而且你错过了宝贵的时机。你知道你必须做什么。你大步走进营地，不想掩饰你那可怕的脚。营地里的猎人们伸手端起步枪。你那令人厌恶的五官和你下面畸形的树桩蹄子，让他们在迷信的敬畏中凝固。你唯一能让自己做的只是发出几声苦笑。你必须克制自己足够长的时间，让猎人们恢复他们的思维。
                进行一次困难的POW检定：如果成功，请转到[285];如果失败，请转到[267]。
                (215)
                `,
                $t1 =='267'?`这次遭遇意味着死亡。你属于人类的核心渴望自己的死亡，但伊塔库亚赋予你的驱动更强大，它渴望的是他人的死亡。
                你冲进了营地的中心，就像一只山猫跳进了一群鹌鹑。猎人们惊恐地嚎叫，四散逃窜。只有一个人有勇气站出几秒，向你开火。射击的力道把你击倒在地。你可以感觉到一个不痛不痒的豁口，从你的肚子里划开，但安然无恙，你又站了起来。这位英勇的猎人和同伴们一起逃跑了。
                转到[268]。
                (215,266)
                `,
                $t1 =='268'?`猎人们惊恐地叫着，分散于森林中。你对人类生活的记忆永远闪回着。你渴望着人类的肉体，伊塔库亚赋予你获得它的力量!你对着星星哭泣。你开始走路，你的速度加快成奔跑。你能感觉到逃亡者温暖、流动的血液，然后你跟随它。
                很快，你到达峡谷边缘，听到下面的呼吸声。一名猎人摔倒并摔断了脚踝。他绝望地向你扔石头。你可以很轻易地从空中滑翔到水底，然后漂向他。当你的冰爪靠近他的喉咙时，当你冰冷的呼吸使他的脸变黑时，他会大叫。你冰冷的獠牙深深地扎进了他温暖的肉里。很快你会再次进食并继续蜕变。这就是伊塔库亚的诅咒，以风行者的方式。
                纳德尔曼的远征结束了。【剧终】。
                (267,285)
                `,
                $t1 =='269'?`在探索一片史前的林间空地时，你偶然发现了一个植物群，这是你的大学同事、古植物学家伊万·库尔托夫最近详细描述过的物种。该物种被认为在更新世时期冰蚀之前灭绝。然而，在这里，在你的周围，它仍然繁茂。你可以简单取下叶子、根、茎和种子，说服密斯卡托尼克的地质和植物学部门赞助一次大型探险。
                兴奋之余，你收拾好标本，毫无意外地带领同伴回到北汉尼纳的外谷。
                记录关键词背水。转到[217]。
                (225)
                `,
                $t1 =='270'?`受伤的狼从诺曼身边倒了下来，你迅速转向西尔维亚。但是，对她来说已经太晚了。在愤怒中，你攻击着野兽并将其从杀戮中赶跑。
                一次成功的急救可以为诺曼或你自己恢复1D3的生命值。转到[278]。
                (271)
                `,
                $t1 =='271'?`西尔维娅躺在地上，脖颈被撕裂。她已经无力回天了。诺曼与一头凶猛的狼在搏斗。他的手和胸部都是血。如果你有步枪，你可以向攻击诺曼的狼开火，或者你可以加入诺曼，展开肉搏战。
                诺曼已经失去了6点生命值。狼的攻击技能
                为30%(15/6),造成1D8+1D4的伤害，15点生命值还剩下12点。
                \f如果使用枪械，你的枪械检定带一个惩罚骰；如果你失败，你就打中了诺曼。如果加入对狼的肉搏战，你对狼的攻击检定将获得奖励骰，因为与诺曼一起，你们的数量超过了野兽。
                如果狼在诺曼死之前就死掉，转到[270]。否则，如果诺曼死了，你的愤怒会赶走剩下的狼群，你可能会埋葬那些倒霉的学生。之后，转到[365]。
                (307)
                `,
                $t1 =='272'?`密斯卡托尼克大学对于你的调研结果非常满意，在伊万·库尔托夫的领导下派出了一支新的探险队。行业内的不成文规则让你打算在麦当劳堡与新探险队会合，而非直接从阿卡姆同探险队出发。
                当你抵达，准备返回北汉尼纳时，你发现雄心勃勃、过分激进的库尔托夫已经独自出发。
                库尔托夫远征队最终消失得无影无踪。你独自
                回到家里，为第二次尝试的组织性而愤怒；然而，接下来的大萧条时代使这样一个项目再也无人问津。
                你关于失落之地的书籍和文章吸引了一批狂热的追随者，但“纳德尔曼的失落之地”的真实性在你的有生之年并没有得到证实。
                纳德尔曼的远征结束了。【剧终】。
                (274)
                `,
                $t1 =='273'?`动物标本比植物更能证明史前山谷的存在。你决定尝试捕获一些生物。
