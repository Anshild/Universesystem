                你的队伍可以进行急救检定来恢复1D3的生命值；然后，转到[513]。如果你选择投降(在任何时候),转到[561]。
                (590)
                `,
                $t1 =='592'?`男人们交换了目光。其中一人将老旧步枪的枪口降到脚下的苔藓上。小心翼翼的，你站起来举起手来欢迎猎人队伍。
                转到[589]。
                (590)
                `,
                $t1 =='593'?`你们不费吹灰之力就通过了“水流分叉之地”,到达了马更些河西支流平缓的河道。之后觅食野味变得简单，当你们来到麦当劳堡时，你们已经恢复到不错的状态。
                转到[433]。
                (513,579,598,599,602,603)
                `,
                $t1 =='594'?`当然，你肯定会回到麦当劳堡。但还有时间进行最后一次短途探险，你希望能了解更多关于北汉尼纳河谷的信息。
                如果你还有所有的同伴，转到[602]。
                如果你有三个学生，但没有查理，转到[158]。
                如果你身边有诺曼、西尔维娅和查理，转到[598]。
                如果你有两个同伴，转到[324]。如果你有一个同伴，转到[279]。如果你独自一人，转到[597]。
                (513)
                `,
                $t1 =='595'?`经过一天艰苦的跋涉，警惕着山谷的危险和怪异，你和诺曼缩在一个花岗石岩檐下，点燃了一堆树枝和松针准备过夜。
                进行科学(地质学)检定：如果你成功了，转到[596];如果失败，转到[513]。
                (279)
                `,
                $t1 =='596'?`尽管天气阴沉，但你的地质知识让你看到你背后的岩石缝中有闪闪光点。一条六英寸长的大石英晶体脉沿着岩石表面延伸。晶脉内是颜色较深、纹理不同的斑块。你喊诺曼确认你的观察。真是金子。
                \f如果你们能活着回到麦当劳堡，你和诺曼这辈子都有的花了!你努力画出你能画出的最好的地图，继续返回文明。
                记录关键词炭画。进行幸运检定：如果你成功了，转到[513];如果失败，转到[279]。
                (595)
                `,
                $t1 =='597'?`尽管存在着风险和身体的虚弱，你还是偏离了回麦当劳堡的直接路线，决心在离开之前尽可能多地探索山谷。
                要深入森林，转到[501]。要沿着森林边界，转到[494]。要探索岩石环境，转到[427]。要探索河流区域，请幸运检定：如果成功，转到[126];如果失败，转到[119]。
                (594)
                `,
                $t1 =='598'?`当你宣布你打算先不回归城镇时，查理盯着你，好像你疯了一样。
                “回到那个邪恶的地方是疯狂的。我不会这样做。”
                要放弃这个想法并回归文明，请转到[593]。要提醒查理旅行结束时是谁付钱给她，转到[599]。
                (594,425)
                `,
                $t1 =='599'?`你的威胁给查理留下了深刻印象。那天晚上，她在守夜期间悄悄离开了，带着皮筏艇和一份供应品作为报酬，而不是一无所获。诺曼和西尔维娅几个小时都不想理你。
                要和你的学生一起返回上游，转到[600]。要绕道返回麦当劳堡，路上留意新发现，转到[324]。要直接返回麦当劳堡，转到[593]。
                (598)
                `,
                $t1 =='600'?`你继续跋涉在北汉尼纳没完没了的地貌。
                如果你有关键词英杰，请转到[601]。要攀登山脊，转到[469]。要紧贴河流，转到[75]。要和河流保持平行，转到[55]。要进入森林外围，转到[218]。要深入森林，则转到[557]。
                (425,564,567,579,599,650)
                `,
                $t1 =='601'?`你带领着你的两个研究生向上游探索。队伍需要一些发现来鼓舞士气。
