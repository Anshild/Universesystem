                (452,453)
                `,
                $t1 =='456'?`超越维度的幻像突然关闭!但你并不孤单；真相在裂痕闭合之前就已经浮出水面。你在皮肤的刺痛中感觉到了它们。你知道它们是古老年代的害虫。你看到了它们的影子，在混沌的洪流中听到了它们的名字：千真万确!
