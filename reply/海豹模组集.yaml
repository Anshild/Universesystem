                (213,292,313)
                `,
                $t1 =='316'?`一条湍急的小河横截在你路线前。你猜，如果诺曼和西尔维娅沿着线路跑，他们肯定会被这样的阻碍留在这一侧区域，甚至可能会沿着小河的边缘行进。于是你沿着水道平行行进，很快你就在潮湿的土壤中看到失踪学生的脚印。
                \f你加快脚步，突然听到学生们惊恐的叫喊声。朝着声音源头跑去，你看到西尔维娅在陡峭的峡谷边缘。诺曼已经跌到了边缘，只靠西尔维娅的拉扯才没让他掉进咆哮的水中!你能及时帮助到他们吗?
