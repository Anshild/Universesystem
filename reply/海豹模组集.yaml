                \f神殿里到处都是血。通过古老者们所在大门的灵魂在尖叫。供品排到没有尽头。基瓦内马种族兴旺而发达。众神为他们力量的激增而高兴。岛屿开始沉没!大陆沉入大海!所有这些都施加在亚特兰蒂斯、在穆大陆身上。尽管基瓦内马的诅咒开始显现，杀戮的进程却毫无停滞。穆和亚特兰蒂斯不再存在。只剩下基瓦内马!基瓦内马人还有它饥渴的神!
