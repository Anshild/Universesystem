            - - "{%\n$t1 == '0' ? \n`\n阳光从窗帘的缝隙挤进来洒在床头，你放松地伸个懒腰，这又是一个蓬松且懒散的周六早晨，没有英国人不爱一个能看见太阳的周末。\n你将被子从身上掀开，起身晃晃悠悠走向洗手间，站在洗手台前，镜子中……\n使用预设卡→1\n自己制作角色卡→2\n`,\n\n$t1 == '1' ? \n`\n镜子中出现了一张没睡醒的脸，平平无奇，普通的身材普通的长相。你认识这张脸的主人，他叫图勒荣格，英国人，22 岁，是大学生，普通家庭，父母健在，没有结婚，没有男/女友，人生目标就是混吃等死。\nSTR55 CON55 SIZ55 DEX55 INT55 APP55 POW55 EDU55 LUK55 HP11 DB0 人类学50 神秘学50 心理学50 图书馆使用50 侦查50 聆听50 话术50 信用评级：10 斗殴50 闪避50 射击50 手枪50\n（持有 100 英镑现金，护甲0）\n假如你没见鬼的话，镜子中这个人很有可能是你自己→3\n`,\n$t1 == '2' ? \n`\n镜子中出现了一张没睡醒的脸，就和那些混吃等死的大学生一样。身为一个大学生，你的年龄应该是在 17~24 岁，不限定性别。时代背景为 1995 年的英国的普通三线城市，你则是一个普通的英国人，当然其他中欧北欧国家出身也可。普通家庭，父母健在，没有结婚，没有男/女友。有一个普通的名字。\n你可以使用 roll 点法或是购点法制作角色卡，使用购点的话你的九维总和应该在 420-600，这取决于你想用什么难度游玩本模组。\n你的信誉评级固定在 10，仅仅持有 100 英镑现金，为此你经常在街对面的披萨店打零工。\n完成车卡后可以前往→3\n`,\n\n$t1 == '3' ? \n`\n简单洗漱后，你走出洗手间走向了客厅。这里是你和你室友\n在校外合租的简陋小公寓，因为隔着一个街区就是贫民区，所以\n格外便宜。这里麻雀虽小五脏俱全，能满足你大多数生活需求。\n平底锅中散发着培根味的油渍告诉你，你的室友已经吃过早\n饭出门，并且很友好地给你剩下了两个没洗的盘子和锅，看见这一幕你决定：\\f帮这个混球把锅洗了，然后安安静静吃一顿早饭→4\n把锅留给这个混球，你选择吃一顿冷餐→5\n穿好衣服去街对面披萨店打零工，在披萨店后厨可以顺手拿一点边角料当早饭吃→6\n披萨店（开放时间）→36\n海獭酒吧→204\n大学图书馆→169\n公爵火车站→77\n松木旅店→86\n圣路易斯医院→149\n方片 K 赌场→158\n公寓→100\n这个小镇和大多数欧洲小镇一样，什么都有，又什么都没有，一切都显得平凡而且宁静。\n重要触发事件：假如 PC 没有进入过地点‘安全屋’，那当时间进行到每晚七点，或者七点之后 PC 在地图上移动的话，都会触发剧情→255\n可选提升难度选项——真实需求模式：\n移动：英国小城市用脚走耗时和公共交通没区别，临近的两个地点移动可能需要半个小时到一个小时，单个场景单个行为可能需要 2-3 小时。并且披萨店/图书馆/火车站只在 08:00~20:00开放。\n进食与睡眠：假如连续 12 小时没有进食的话，你的一切重体力活都需要增加一个惩罚骰。连续超过 24 小时没有进食/睡眠的话，一切行为均需要一个惩罚骰，每次在地点间移动需要进行体质检定，失败的体质检定会让你当场晕倒，等你再醒来就已经在圣路易斯医院了，并且被强行收取 500 英镑的治疗费用。\n\n`,\n\n$t1 == '4' ? \n`\n你决定今早就吃煎鸡蛋与培根了，和以前一样。一个完美的早晨就得是培根配鸡蛋，伴着猪油发出的悦耳噼啪声，在等培根熟到恰到好处的短短几秒钟内，你的目光被灶台上的一张便签条吸引过去。\n看看便签条→51\n继续做饭吃饭→5\n`,\n\n$t1 == '5' ? \n`\n解决完早餐之后，你意识到快要到去披萨店打工的时间了。\n你决定穿好衣服，去披萨店打工→62\n你认为没什么能比一个充满阳光的周末重要，班就翘了吧→52\n`,\n$t1 == '6' ? \n`\n早晨九点半你来到披萨店，时间还早，没几个顾客。一般只有夜猫子会在这个时候来披萨店。\n“今天来挺早啊，还没到高峰期，随便找个位置坐坐，别影响到其他顾客。”说话的人是德马雷先生，他是披萨店的老板，你的雇主。它身为一个意大利人来到英国做美式披萨，还卖夏威夷口味的披萨，这一定是个有故事的人。\n德马雷默默地看起了报纸，披萨店里只有一个顾客，这时时间还早，你还可以放松一下，你决定:\n找个位置坐下，蹭披萨店的报纸看看，或是跟那位顾客聊聊→200\n去后厨蹭一点边角料，给自己做一顿早餐→62\n`,\n$t1 == '7' ? \n`\n你将垃圾桶拿过来