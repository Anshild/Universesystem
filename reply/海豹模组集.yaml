                (291)
                `,
                $t1 =='295'?`你们两个饿着肚子走了好多天。一天早上你醒来发现诺曼不见了。你找了整整一天，却找不到他的踪迹。最后，你不得不承认你是一个人了。
                转到[67]。
                (279)
                `,
                $t1 =='296'?`松林中发出的威胁性的嚎叫声让诺曼心惊肉跳。你决定在一个洞穴里休整过夜，也利用其来抵御捕食者。
                你们两个在入口处生火，在破旧的毯子里休息。当你逐渐入睡时，你意识到洞穴深处有什么东西在呼吸，一个巨大的东西。你提醒诺曼。然后，你听到它在动。它的气味扑面而来，让你难以忍受。
                要向看不见的生物射击，请转到[325]。要等待并看看发生了什么,请转到[326]。
                (279)
                `,
                $t1 =='297'?`追踪猎物不得。而原本盛产浆果的果丛已经枯萎脱落。饥饿的威胁是真实的。
                进行生存(丛林)检定：如果你成功，请转到[513];如果失败，请转到[331]。
                (198,279)
                `,
                $t1 =='298'?`随着夜幕降临，狼的长嗥声不断响起。你捂住诺曼的眼睛，他的神经已到了崩溃地步。你们偶然发现了一个洞穴，在那里过夜似乎是明智的。
                你的运气似乎变好了，因为你在晚餐时杀死了一只雪兔。当你们两个嚼着它多筋的肉时，树林里一片寂静。猫头鹰、蟋蟀甚至狼都停止了它们的叫声。暮色中弥漫着某种看不见的威胁。也许诺曼的情绪正在影响你。
                要熄灭火焰并隐藏自己，请转到[333]。要使火焰更旺，请转到[329]。
                (279)
                `,
                $t1 =='299'?`这个小个子男人无法行走，所以你的团队带着他行进。到了中午，他似乎已经晕倒了。你们设立了营地，再次尝试让你的俘虏进食。他还是拒绝；他似乎真的愿意去死。
                到了早晨，他真就死了；他的尸体迅速开始腐烂。携带着它是令人厌恶的任务。最后就连骨头也在短短几天内碎裂成灰色粉末。你的标本就这么多了。
                要继续你的归途，请前往[158]。要改变航向，探索北汉尼纳河谷，请前往[89]。
                (281)
                `,
                $t1 =='300'?`“如果我们释放他，他会带着他的人找回来的。”伯纳德也许是对的。但你是探险队的领导者，而你需要对对待其他文明的行为负责。
                你解开小个子的绑，退后。他以惊人的速度冲进树林。你督促你的团队朝相反的方向离开。
                进行幸运检定：如果你失败了，转到[85];如果你成功了，想继续探索，转到[89];或者，如果你想返程，转到[158]。
                (281)
                `,
                $t1 =='301'?`你抓起你的步枪，对着曾经是你研究助手的怪物的胸部射击。
                如果你命中了，转到[302]。如果没打中，转到[339]。
                (303,305)
                `,
                $t1 =='302'?`一次重击!你的前学生因恐惧而嚎啕大哭，紧紧抓住它的心。你还记得传说中风行者的心脏是最脆弱的器官。你瞄准同一个位置，再次开火，但这个生物已经不愿再受伤害，从营地逃跑了。
                现在你必须独自面对森林。获得1D6 SC。然后，转到[67]。
                (301)
                `,
                $t1 =='303'?`当真相袭来时，你感觉摇摇欲坠：诺曼已经被北方的食人精神体所附。他是个风行者!
                进行理智检定。如果失败，失去1D6 SC。要进入树林，请转到[304]。要与生物战斗，请转到[301]。
                (328)
                `,
                $t1 =='304'?`你在茂密树林的掩护下奔逃。怪物紧随其后，它即将赶上。大森林是属于它的家园。你唯一的希望就是把自己隐藏在树冠下。
                进行潜行检定：如果你成功了，转到[336];如果没有，请转到[337]。
                (187,303,306)
                `,
                $t1 =='305'?`“不!“西尔维娅粗声粗气地说。她的脸只是变得比之前在大学辅导室分析棘手的论文时更加畸形一些。而她的声音如恶魔般。“别再靠近了。它就在我身上，我会杀了你的。快跑!我….求你了...”你瞥了诺曼一眼。令你惊讶的是，他在盲目的恐惧中飞快地离开了。如果你犹豫，你可能再也找不到他。
                要试着说服西尔维娅摆脱她的疯狂，请转到[306]。要试着射杀她，请转到[301]。要追赶诺曼，请转到[338]。
                (283)
                `,
                $t1 =='306'?`西尔维娅发出可怕的胜利呐喊。当她大叫时，她似乎变了。她的皮肤上出现了一片片黑色的冰状物。
                进行理智检定：如果失败，则失去1D6SC;如果仍保持理智，转到[304]。
                (283,305)
                `,
                $t1 =='307'?`狼群包围攻击你的队伍并将你们分散。它们离你们的步枪太近了，必须用近战武器进行最后的肉搏。被分开和包围，这让你喘不过气来。
                除非你们已经减少了它们的数量，否则有2D6只恐狼。其中三分之一会攻击你们每个人。如果没法整除，第一只多出的狼会攻击西尔维娅，第二只会攻击诺曼。
                \f如果狼少于三只，你可以代替一名学生与他们的狼战斗：转到[271]。或者你可以逃跑自救：转到[340]。其他情况，忽略学生的战斗，与那些针对你的狼战斗。恐狼有30%(15/6)的攻击，造成1D8+1D4的伤害，每只有15点生命值。如果你在没有受伤的情况下赢得了这场战斗，请前往[340]。如果你幸存下来但受到了伤害，请前往[347]。如果你失去知觉或死亡，纳德尔曼的远征就结束了。【剧终】。
                (286,288)
                `,
                $t1 =='308'?`你帮助学生爬上树干。在他们爬上后，你也往上攀爬。你用胳膊搂住一根结实的树枝，但有什么东西拽着你。是头狼跳了起来，用牙齿咬住了你的靴子!西尔维娅和诺曼抓住你的肩膀，把你往上拽。但狼的力量可以把你们三个从树上拖下来。
                你必须决定是把你的脚从狼的嘴里抽出来，还是把它的头撞到树干上。
                进行DEX或战斗(斗殴)检定。无论你选择哪个，如果成功，转到[344],如果失败，转到[345]。
                (288)
                `,
                $t1 =='309'?`巨大的猿猴般的身影，至少有几十个!它们看起来很兴奋，用巨大的爪子挥舞着棍棒和石头。被困在沟壑里，你感到很无力。
                要开枪吓退他们，请转到[346]。要保持冷静，请转到[348]。
                (289)
                `,
                $t1 =='310'?`巨大的淌口水的猿人!你们被困住了!在劫难逃!你的腿打在弯，你晕了过去。
                如果你遭受临时疯狂，请转到[350]。如果你遭受不定时疯狂，则转到[364]。
                (289,290)
                `,
                $t1 =='311'?`有默契的，你和诺曼在看到从树林中缓缓而出的巨大猿猴般的身影都保持了安静。你听过这种生物，野人，在这次旅行前，你曾怀疑过它的存在。
                它身高超过七英尺，全身覆盖着一层深棕色的短毛发，上面的白色斑点有可能是泥块儿。野人的四肢，特别是腿部，比人类的更长、更粗。它显示出一个矢状嵴，像一只雄性大猩猩。从你的人类学研究中你明白，这样的特征使它失去了作为人类近亲的资格。正如你刚所猜测的那样，雄性以一种特殊的摆动着大胳膊的步伐移动。他的嘴唇上挂满了口水。
                \f当它经过后，你向诺曼建议，你们要跟上这只野人。他咽了咽口水，但最后点头表示同意。
