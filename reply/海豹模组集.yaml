                《冰霜独行》是一部单人《克苏鲁的呼唤》冒险书，你既是守密人，又是玩家。在这本书中，你预设的身份为L·C·纳德尔曼博士(frost655)，他是20世纪20年代在密斯卡托尼克大学任职的人类学家。你已经前往调查北汉尼纳，这是加拿大西北部的一片未知地区。
                北汉尼纳有许多危险，你的第一次探险可能不会以科学或学术上的荣耀而结束。谢天谢地，你可以多次性尝试这一冒险。大森林是不可预测的，它们有许多不同的冒险和可能的结果。每次重新开始，你都可以重新分配纳德尔曼博士的技能点。你对前方危险的了解将提高你的机会，但仅仅是知识和技能并不足以对抗黑暗力量!
                \f*在开始游戏前，请确保你观看了【冰霜独行前言】【冰霜独行规则】【冰霜独行帮助】，输入【】内的文本来查看。四个都看完后就可以输入“frost0”开始你的游戏了（之后翻页输入“frost页数”即可）
                在一次游玩结束后可以输入【冰霜独行后记】来查看后记
              - 1
    - enable: true
      conditions:
        - condType: textMatch
          matchType: matchExact
          value: 冰霜独行前言
      results:
        - resultType: replyToSender
          delay: 0
          message:
            - - |-
                那还是1985年，我还在上高中。我们的小团体从新手入门套开始玩的D&D(龙与地下城),在那封面上，一条扭动的绿蛇从溃烂的水池中冒出来，威胁着冒险者。我曾经骑着自行车去玩游戏，把入门套放在车把上挂着的塑料袋里，但塑料袋被前轮的车条绞住了，规则书的封面也因此被撕碎。
                \f我对另一个游戏《克苏鲁的呼唤》也很感兴趣。在封面上，一只扭动的绿色触手蜿蜒穿过墓地，威胁着冒险者。我通过送报纸攒下了些钱，买了一套盒装。我仔细阅读了关于克苏鲁神话的章节，其中有令人印象深刻的深潜者和黑山羊幼崽的剪影。但问题是，我不知道如何将我的研究经验转化为一场关于调查和恐怖的游戏。
                又过了几个星期，我买了Glenn Rahman的《独抗温迪戈》。我的纳德尔曼博士几个有前途的研究生失踪了，但最后，在大森林里，我明白了《克苏鲁的呼唤》TRPG是如何运作的。我从此深陷于此。
                三分之一个世纪后，当迈克·梅森(MikeMason)让我把这本书修改成新版本时，我欣喜若狂。编辑一个大型的单人冒险需要对互动故事的结构有一定的、也许是反常的迷恋。当我向他展示生成的图表时，迈克建议我把它印在T恤上，但实话实说，我怀疑它即使印在XXXL号上也印不全。它可能是难以估量的量级…
                \f在过去的三十年里，我们文化上一直在前进，迈克和我讨论了对原文的某些修改。GlennRahman的第一版为纳德尔曼博士的男版和女版提供两个角色表这方面领先于当时。我们还想平衡配角的性别，所以有人必须成为女性。也许是一个大胆的举动，我们决定换掉当地向导查理·福克斯塔(Charlie Foxtail)。坦率地说，我还充实了研究生的背景故事，我希望如果你失去了一个，你会感到更加痛苦。不过，我相信你的纳德尔曼探险不会发生这种事!
                原版的老玩家可能会注意到一些其他变化。导航的随机掷骰已经被取消，对土著地区的描述更加和谐，不再需要记录汉尼纳神话。但你的探险仍然充满了危险和令人难以置信的发现，原冒险的精神仍然完好无损保留。
                因此，无论你是一位经验丰富的人类学家还是探索北汉尼纳的新手，你的学术生涯都将迎来一个迷人的转折。只要注意，在星空下宿营的漫漫长夜中，你可能会感觉到脖子后面有冰凉的触感，或者听到树林里有声音在呼唤你的名字..
