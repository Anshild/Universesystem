          value: 《桥》
      results:
        - resultType: replyToSender
          delay: 0
          message:
            - - |-
                1.本模组使用规则为COC7th，但并没有克苏鲁元素内容。
                2.适合1PC游玩。舞台可以是现代的中国或者日本（作者并不太熟悉其他国家的民俗和恐怖传说），游戏目的是顺利地穿过桥下的地道回家。
                3.这是一个在设定上几乎不会出现撕卡的类似于鬼屋的超短体验模组，请抱着像下班或者晚自习之后回家一样轻松愉悦的心情游玩吧。
                4.模组是非常线性的，也可以有kp，KP可以在游玩过程中魔改和增加各种各样的要素，请以让PL有着新奇的体验为目的来改造这个模组的细节吧。
                5.模组首发魔都，作品链接https://cnmods.net/mobile/moduleDetail?keyId=2651，作者By：秦鸾QQ：3309565818此模组主题内容为秦鸾 3309565818@qq.com原创，未经许可不得修改发布，未经许可不得修改发布，禁止用于商业目的，制作视频及其他衍生行为请联系作者本人。单人书插件制作已取得授权，请仅做分享用，感兴趣请联系原作者，禁止使用此插件进行任何商业行为。
                6.事先需使用.pc new创建新卡。
                请发送“qiao1”开始游戏。
