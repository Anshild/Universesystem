                (445)
                `,
                $t1 =='448'?`令人吃惊的谁会想到在这片原始的土地上会看到这样的东西?这是一个巨大的圆圈，周长超过200英尺，由巨石和巨大的石灰石板组成，以高超的工程技术放置在一起形成一个轮子。从车轮的中心，28个石轮辐精确地辐射到轮廓分明的周边。建筑的中心是一座小型的礼仪建筑，形状像蜂巢。
