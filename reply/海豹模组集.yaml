                (246,250,254)
                `,
                $t1 =='248'?`当你匍匐在地时，更多矮小的灰色男人进入了峡谷，另一个身材高大、细长、披着鹿皮的人也进入了峡谷。灰色矮人围成一个圆圈，围绕着光芒开始一场缓慢的、混乱的舞蹈。进行祭祀的人捡起砍下的人头，怀着崇敬之情，把它献给戴鹿皮兜帽的人。兜帽散落。一个可怕、威严的高加索白种老妪出现。
                \f她接受了萨满递来的首级，吟唱着模糊不清的圣歌。她把流血的头颅举过头顶，接受了它的鲜血，这让她灰白的头发上留下可怕的斑驳。
