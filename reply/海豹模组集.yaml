                $t1 =='503'?`粉红色的龙虾状生物，五英尺高，在下面的森林垃圾中爬行。嗡嗡声还在继续。突然，一个人类尖叫声打破了噪音。你看到一个穿着狩猎夹克的人被两个恐怖生物拖下沟壑，扔到后面的山谷。当它们扔下他时，他试图爬走。其中一个生物在身上拿出一个Y形物体，之后逃跑的男子身上覆盖了一层蓝色的薄雾。即使从这个距离，你也能看到他在发抖。冰晶覆盖着他的夹克和裤子，以及他的头发和胡须。
