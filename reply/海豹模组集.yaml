                (600)
                `,
                $t1 =='602'?`当你宣布你的打算时，查理看着你就像你疯了一样。她站起身来。
                “回到那个邪恶的地方是愚蠢的。我不会去的!”
                要放弃这个想法并回归文明，请转到[593]。要提醒查理旅行结束时是谁付钱给她，请转到[603]。
                (594,425)
                `,
                $t1 =='603'?`你的威胁显然让查理很在意。为了这次探险后，她不会一无所获，于是她趁着晚上守夜的时候偷偷离开了，带着皮筏艇和一份补给作为她的工作的补偿。你可以从学生的眼神中看出，他们对你的打算也信心不足。
                若要在没有向导的情况下向上游发起探险，转到[604]。若要绕道返回城堡，路上密切关注新发现，转到[158]。若要接受形势并直接返回城堡，转到[593]。
                (602)
                `,
                $t1 =='604'?`你和你的学生一起考虑可能的路线。
                如果你有关键词英杰，转到[158]。要探索附近的峡谷，转到[90]。要沿着河流行进，转到[60]。要将山脉作为目标，转到[56]。要尽可能提高海拔，转到[552]。要探索森林深处，转到[461]。
                (30,88,195,409,425,603)
                `,
                $t1 =='605'?`伯纳德无所畏惧地沿着窄道前进着，他催促着你继续探索这个隐藏的峡谷。
                当你们所有人踏上坚实的土地时，你松了一口气。学生们散开，凝视着风景。当你追上他们时，你同样惊讶于这个新发现的山谷到底有多大。兴奋之余，你的团队开始了初步勘察。
                \f很快你们就可以确认你们发现了一个史前时期留存下的生存堡垒。沙地和泥地里到处都是非现代北方野兽的动物足迹。你现在多希望你的研究方向是古生物学。
                记录关键词英杰。进行困难的INT检定或常规科学(植物学)检定：如果成功，转到[606];如果失败，转到[607]。
                (92,642)
                `,
                $t1 =='606'?`在探索史前遗迹时，你偶然发现了一个植物群，这些植物正是你的密斯卡托尼克大学同事、古植物学家伊万·库尔托夫最近详细描述的物种。该物种被认为在更新世冰川作用之前灭绝了。然而，在这里，在你周围，它仍然繁茂。你可以很轻易地收集到树叶、树根、枝条和种子，这一切都是为了说服大学的地质和生物部门资助一次大型探险。
                \f有了这些证据，你就可以离开这个危险的地区了。你收拾好标本，带领你的三个同伴毫无意外地回到北汉尼纳的外围。
                记录关键词背水。转到[158]。
                (605)
                `,
                $t1 =='607'?`尽管许多种类的植物生长在附近，但你对古植
