                \f最后，一切就绪。要开始冒险，请输入frost1。
                `,
                $t1 =='1'?`在马更些大学西分校待了几天后，密斯卡托尼克大学闷热的走廊似乎已离你很遥远了。从正午的耀眼光照到日落时的柔和霞光，光斑都点缀着水面。驯鹿从岸边凝视着你；前面，一只苍鹭从浅水处擒来一条不幸的刺鱼。如果不是桨叶持续转动的聒噪，这感觉就像是一次度假。
                \f每一天你和学生与查理的关系都更加亲密。你的汽油供给有限，所以你尽量减少开动舷外发动机。阳光和风给与了伯纳德他渴望的户外景色。
