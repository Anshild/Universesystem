228\n否则→237\n`,\n\n$t1 == '248' ? \n`\n某年某月某日，你从美梦中醒来，哦，看看这些绫罗绸缎，那个年轻管家总能给你寝宫添一些新花样，伸伸手就能拿到那近在咫尺由仆人给你所准备好的由精致瓷器盛放的美食，正在你准备享受这一份平凡的时候，忽然保安室长推门而入，天哪，这是何等的粗俗与不雅，在你训斥之后他说明了来意，原来是管家找到了新的小丑弄臣供你玩乐，那人正在大厅中等待。\n你不会像这位勇武莽夫一样做事有失礼数，在仆人的协助下脱下睡衣换上紧身塑形的华服，在众人的搀扶下来到大厅，坐定于王座之上，居高临下地看着这位弄臣，他看起来平平无奇，既不滑稽也不睿智，完全不像一个合格的弄臣。\n\\f询问他是谁→249\n询问他能为你带来什么→250\n询问雇佣他所需的代价→251\n你觉得已经看透这个人了→252\n等等……你不是弄臣，你是……→δ\n`,\n\n$t1 == '249' ? \n`\n“我只是一个普通人，和你一样，我和你一样。“对这个耐人寻味的回答，你不置可否。→248\n`,\n\n$t1 == '250' ? \n`\n他拿出羊皮卷，“与我签订协议，您将重获荣耀。”\n这令你略感愤怒，说的就好像你已经失去了荣耀一般。→248\n`,\n\n$t1 == '251' ? \n`\n“一切，你的一切。”对方表情平淡。\n你也格外的平静。→248\n`,\n\n$t1 == '252' ? \n`\n经过你的深思熟虑，你决定：\n你决定雇佣他→260\n你决定赶走他→253\n`,\n\n$t1 == '253' ? \n`\n你让卫兵赶走了他，从此之后，你又回到了那平淡且奢华的生活，就像是童话中所写的一般。→254\n`,\n\n$t1 == '254' ? \n`\n达成结局-【Happy End！】\\f你和自己最爱的人和你的孩子们一起快乐地生活在那遗世独立的黄金乡，享受永世的喜乐平和与安宁。时间流逝，星辰循环往复，春天来临之时,街道小巷都布满了摇曳的绿叶和芳香的鲜花。然后是酷热的夏天，幸福的人民在黄金沙浪之上纵情狂欢。然后是秋天，天上挂着金黄色的收获月亮，山岗在落日照耀下变得金碧辉煌。最后是冬天，凛冽的寒风呼啸着，冰雪笼罩了每一片土地——\n\\f欢迎回家。\n或者你并不满意这个结果……开玩笑的，怎么可能有人不满意这个结果呢？\n`,\n\n$t1 == '255' ? \n`\n你走在夜幕笼罩下的街道，几朵乌云遮住了月光，路灯不争气的时断时续。虽然并没有那么冷，但你还是下意识紧了紧衣服。\n一股恶意爬上了你的脊背，你能感觉到恶意每一个触脚撩过你皮肤时产生的不适感，惊得你打了个寒颤，你无法控制地转头向恶意袭来的方向望去。\n那是一辆轿车，无声无息，甚至没有开车灯，就这样一直默默地跟在你后面，看见你转过头，车缓缓停下，从上面走下两位身着风衣面目不详的人。\n\\f你只能通过声音辨识出说话的那人是女性“我家主人想请你去做客。”\n现在已经晚上九点多了，没有人会在这时候请人去做客。\n你选择逃跑，你转头向小巷中逃去→258\n你选择用武力解决问题→259\n你选择跟他们走→257\n`,\n\n$t1 == '256' ? \n`\n你眯起眼睛看向黑暗中，天哪，你不知道那是什么，但绝对不是人类！宛如没有胳膊一样平滑的身体曲线，过于细长的头部，极度塌陷的肩膀还有那闪闪发光的金色瞳孔。\nSC1/1D3\n你觉得不再深究那究竟是什么比较好→70\n`,\n\n$t1 == '257' ? \n`\n你坐上车，没过多久车停在了某个废弃的酒吧前，在其中一人的带路之下，你跟着走进这破旧的酒吧，走进这一片黑暗。\n你被安排坐在了一个沙发座上，在带路人退下之后，从黑暗中淡出了两个身影，一位着装典雅古朴的年轻女性，和一位身着西服的中年男性。\n这名女性对你行了一个提裙屈膝礼，显得高贵而且雅致，给人一种中世纪贵族大小姐的感觉，随后女性说道……→74\n`,\n\n$t1 == '258' ? \n`\n你转头就跑！寂静的夜幕下只剩下你们三人的脚步声与自己的心跳声！\n你需要进行一个困难难度的敏捷检定，假如你检定成功那意味着摆脱了他们的追踪，有惊无险的度过了今晚，移动至任意小镇地点\n披萨店（开放时间）→36\n海獭酒吧→204\n大学图书馆→169\n公爵火车站→77\n松木旅店→86\n圣路易斯医院→149\n方片 K 赌场→158\n公寓→100\n假如你检定失败，那毫无疑问他们抓住了你，假如你选择妥协，则→257\n你也可以选择拼死一搏→259\n`,\n\n$t1 == '259' ? \n`\n战斗一触即发！\n这两人敏捷为 50，体质为 60，HP 为 12，还穿一件特质的马甲（护甲 2）。他会使用手枪