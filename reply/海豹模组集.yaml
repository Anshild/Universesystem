                (237)
                `,
                $t1 =='284'?`你逃出了小矮人们的狩猎，但当你终于停下来喘口气时，你只剩下自己。你不知道诺曼和西尔维娅是否也逃掉了，也不知道他们最终逃到了哪里。你能找到丢失的学生吗?
                进行幸运检定：如果你成功了，转到[316];如果你失败了，转到[67]。
                (240)
                `,
                $t1 =='285'?`你无声的嘲讽至少让一些猎人对你刮目相看。他们围起你，而其中一人则从篝火上盛出一杯滚烫的肉汤。如果你被迫喝了，你冰冷的心一定会融化，你就会死的。而死亡是痛苦的。
                你的黑暗求生本能觉醒了。你开始在猎人控制下挣扎。
                三个猎人抓着你。每个人的STR值为60。对他们各进行一次STR对抗检定，你将因为超自然形态获得奖励骰，而猎人则因恐惧而具有惩罚骰。如果你赢得三个对手的全部对抗，转到[268]。如果没有，纳德尔曼的远征就结束了。【剧终】。
                (266)
                `,
                $t1 =='286'?`你警告西尔维娅和诺曼做好准备。你的队伍位于一丛兰花般的花丛后面，等待着野兽的尖叫。
                片刻后，令人难以置信的犬科动物进入视野，它们类似于博物馆里重组的恐狼的标本。你听到两个学生突然呼吸急促。你把他们置于致命的危险中了吗?现在逃跑太晚了。
                这里有2D6只狼。在狼群袭击你们之前，你们每一个带着步枪的队员都可以开火两次。不计算伤害；每个成功的命中都会干掉一只狼。
                如果你的队伍至少杀了一半的狼，狼群就会撤退；转到[287]。否则，请注意还剩多少狼，然后转到[307]。
                (273)
                `,
                $t1 =='287'?`你和你的学生一起出来探查屠杀现场。虽然很重，但带走一只恐狼的头将是支持你的发现的令人信服的证据。西尔维娅准备把它带回文明。
                记录关键词背水。转到[652]。
                (286)
                `,
                $t1 =='288'?`长嗥听起来确实有很多捕食者，你在草地上没什么防护。你们三个冲向一棵位于树林中央的独立大树。
                在你身后，一群超大的狼突然映入眼帘。整个狼群紧追不舍，齐头并进，奔向你的逃跑小队。距离足够你们先到达那棵树。但你们能及时爬上枝头吗?
                为诺曼和西尔维娅，你各进行一次攀爬检定。因为你们相互合作，每次检定获得额外的奖励骰。如果三次检定都成功，转到[308]。如果有人失败，则转到[307]。
                (273,317)
                `,
                $t1 =='289'?`你沿着一条沟壑爬上橡树遍布的斜坡。你注意到一种奇怪的山羊气味。当你抬头看时，你发现自己已经被包围了。
                进行理智检定：如果你失败了，失去1D6
