            - - "{%\n$t1 == '1'?\n` \n“那么——旅途开始，衷心祝愿你旅途愉快。”四周浓郁的阴影淹没了你，再次睁眼，眼前已经换上另外一番景象。{FormFeed}\n1953年冬，随着玻璃破碎声，你们的挚友奥尔森博士从高楼一跃而下…… 然而迎接受委托的调查员的却是：扑朔迷离的集体癫狂事件、事故频出的停电事件、还有那未知的窥视…… \n这是一个可独自进行的单人游戏书，送给初入克苏鲁TRPG的你，也希望你能够在闲暇之时获得些许的快乐。\n{FormFeed}深秋的阿卡姆一如既往地让人抱怨久驱不去的潮湿，你打着哈欠将事务所的门窗打开，继续着你那日渐亏损的事业。正当你准备用一杯浓厚的咖啡来唤醒瞌睡的脑子的时候，一阵急促的敲门声使你放下了杯子。\n “尊敬的侦探先生/女士。我的丈夫昨日去世了……我知道您是阿卡姆最有能力的侦探，您能帮帮我吗？”\n隔壁的邻居奥尔森夫人带来了丈夫，也是你的挚友“弗兰克·奥尔森”的噩耗：他于前日出差考文垂德地区公办，随即于当晚坠楼身亡。联邦警局将结果定性为自杀，这个荒唐结论让这个身怀六甲的妻子几乎昏厥于地，在走投无路之下，她不得不求助于你来调查弗兰克·奥尔森的死因，并希望你将凶手绳之以法。\n{FormFeed}“我拜托了我的妹妹帮忙，她在当地的报社工作，你可以向她寻求帮助。”\n数小时后，你驾车来到了老友自杀的达斯塔德勒酒店。这是本地最高的建筑，并能从高层俯视整个城区；它装饰考究，墙体由砖瓦玻璃墙及框架混凝土结构组成，也是整个城市来访者的首选居住地。\n你将车辆停靠后，大步走进了酒店大门。\n——现在，请转向（同频2）\n`,\n\n$t1 == '2'?\n`\n映入眼帘的是一个半圆形的前台，随着你的靠近，一位面容姣好的小姐向你略微屈腰。在你拿出奥尔森夫人的委托材料后，边上的值班经理接待了你。\n“我已经接到了奥尔森夫人的来电，是的，根据联邦警局的规定，他的房间已经封闭了，警官也在楼上。”\n做完这些后你在值班经理的引导下前往了奥尔森先生的房间1018A。\n——现在，请转向（同频19）\n`,\n\n$t1 == '3'?\n`\n随着街面的逐渐冷清，在结束营业的街道上，考文垂德地区的夜生活终究开始；无论是体面的政府雇员，或是高高在上的绅士女士们，亦然或浓妆艳抹的贵妇人们，他们在门口迎宾门童的鞠躬迎接下走进了这个只有晚上才营业的中心音乐会所。\n作为会员制的音乐会所，衣着寒酸的你在试图进门时被礼貌地拦住了。\n“这里是会员制会所，请问您是会员吗？”\n{FormFeed}正当你窘迫地试图询问如何加入会员的时候，一名路过的女士好奇地打量着你：她是一名面容姣好的女子，有着栗色的微卷短发和绿玛瑙般的双眸，双手提着琴箱，散发着知性的气息。\n而她高耸的胸口上夹着一个名牌：吉娜·布蒂克。\n现在检查你的「外貌」属性:\n——如果到达 60，请转向（同频67）\n——如果未过 60，请转向（同频53）\n`,\n\n$t1 == '4'?\n`\n“好的，我知道您现在受到了惊吓，但是这是必须的。”\n你见到了在达斯塔德勒酒店的警官，阅历不丰富的他脸色几乎比你还差上些许。\n冗长而详细的询问花费了大量的时间，直到痕迹科的法医专家向警官报告了情况，而警官似乎被这一结论震惊地喊了出来。\n“什么，你说他在我们进入房间之前就已经死了？”\n{FormFeed}在再三询问后，警官无奈地吩咐人员将尸骸装袋，准备按照程序通知遗属处理后续事宜，并在你签完字后说道：\n“如果有更多的消息我会通知您的，现在您可以去休息了。”\n你看了下表，已经深夜一点多了，惊吓和车程让你全身乏力，是时候把自己摔在松软的床上了。\n——请转向（同频34）\n`,\n\n\n$t1 == '5'?\n`\n此时，将你的回合数标记为 3，并在每次你选择行动后将回合数数值加 1。\n现在你准备：\n——搬运柴油发电机恢复供电，请转向（同频80）\n——拿起磁带播放机，请转向（同频17）\n——前往负压室暂避锋芒，请转向（同频68）\n假如你的回合计数已经到达5，请跳转（同频60）\n`,\n\n$t1 == '6'?\n`\n各种思路在你的脑海中碰撞，一定有什么是吉娜小姐所忌惮的，你的机会不多，现在你打算先谋取一些信息来验证猜想。\n你可以从以下选项中选择一项，但请不要重复你的选择。\n——掏出空白药品 LSD 讹诈吉娜小姐，转向（同频14）\n——试图利用包间的监控威胁吉娜小姐，转向（同频64）\n——试图询问音乐磁带下落，转向（同频71）\n——沉默而接受提议，转向（同频52）\n如果你都已经试过了你想了解的选项（或你打算推进时间），请转至（同频69）\n`,\n\n$t1 == '7'?\n`\n倏然之间，一阵悠扬的笛声从深处的包间扩散出来，当你侧耳聆听之时，这声音穿过了演奏者们的小提琴声，清晰地传入了你的耳中。\n当第一个音符传入耳中之时，似乎周遭的喧哗及伴奏声都被隔绝开来，这笛声如怨如泣婉转悠长，又夹杂着放荡不羁。以至于你的思绪被这笛声所吸引，仿佛催动你不断靠近它，更加靠近它，以向那位技艺高超的演奏者致以最崇高的敬意和忠诚；你觉得无论是金钱还是地位，只要能够听着他的演奏就不枉活在这个世界上。\n{FormFeed}直到……数名宾客一头栽倒的突兀响声，以及灯泡的炸裂声让你清醒了过来。\n现在，快动起来吧！你需要弄清声音的来源地，在事情变得更糟糕前弄明白发生了什么。\n现在，检查你的聆听技能点数：\n——如果超过 40，请转向（同频11）\n——如果不过 40，请转回（同频72）\n`,\n\n$t1 == '8'?\n`\n射击声再次响起，你和吉娜小姐将子弹倾泻在它的身上，你好像感受到金属击打在淤泥之中的徒劳，这团糜烂的肉块，除了略微停顿了下，便继续沉浸在它的美妙笛声之中。\n——现在，请转回（同频76）\n`,\n\n$t1 == '9'?\n`\n现在你已经坐到了沙发上，和对面这名丽人共进茶点，那么你想知道哪些情报呢？\n你可以从以下选项中选择一项，但请不要重复你的选择。\n——询问挚友奥尔森的情况，请转向（同频58）\n——询问落魄画家亨利的情况，请转向（同频70）\n——询问音乐会所中心的情况，请转向（同频29）\n如果你都已经试过了所有选项（或你打算推进时间），请转至（同频15）\n`,\n\n$t1 == '10'?\n`\n汉娜小姐接过了这个没有标签的空白药瓶，对着灯光碾了碾里面的药片，在闻了许久后小心地用手指点了下舌尖，也用湿润的指尖点了点你的唇舌。\n“嗯……没有错，这个应该是 LSD，一种精神药物，记着这个味道，别被人下了药都不知道。这个副作用挺大的，听说有一定的成瘾性和致幻性，我也不太清楚这个是哪个药商制造出来的，不过有心的话总能有办法买到。”\n你摩挲了下味道，似乎是有些刺激性的微苦感。\n——现在你可以转回（同频9）来了解其他情况\n`,\n\n$t1 == '11'?\n`\n音乐会所变得极其混乱，无数宾客们抛下了瘫软或捂住双耳的同伴，开始推搡着向大门处涌去。试图维持秩序的服务生被撞倒在地，眼看着就要发生踩踏事件。你在混乱中快速地向深处包间靠近的时候，你好像听到了临近的开门声，随后本应无人的包间里闯出了数名带着袖标的安保人员，他们大步地向某个方向跑去。\n——现在请转向（同频72）\n`,\n\n$t1 == '12'?\n`\n根据警官登记的信息，拿到亨利先生地址的你在询问了几次路人后，终于在夜幕低垂时分到达了亨利先生的住所。你也偶有听挚友提起过这名画家，似乎最近由于卖画不太顺利而略有窘困，以至于搬到了稍显边僻的地方。\n现在请检查你的侦查技能：\n——如果数值超过 50，请转向（同频22）\n——如果数值未超过 50，则转向（同频31）\n`,\n\n$t1 == '13'?\n`\n夜幕降临，你驱使着汽车来到了汉娜小姐的工作地：BBC 新闻驻点办。这是世界闻名的跨国媒体中心，随着世界格局的变化，大量的驻点进驻美国的大小城市；而位于地区东部的BBC新闻驻点办拥有着五十多名员工，广泛涉及当地各领域信息资讯。\n然而，夜晚的拜访并不是一个好主意，禁闭的大门和朝九晚六的工作时间提醒着你这里早已人去楼空。\n{FormFeed}现在你可以：\n——前往当地的音乐中心会所，请转向（同频3）\n——拜访奥尔森先生的旧友画家亨利先生，请转向（同频12）\n——回到酒店睡一觉，请转向（同频45）\n`,\n\n$t1 == '14'?\n`\n你掏出了药瓶摇晃了数下，药片互相碰撞发出了声音。“这个药片是你们的吧，如果把它曝光你们会惹上麻烦的。”\n你听到了一声嗔笑，栗发女子给自己又划上了一根香烟，纤细的手腕甩动了两下将火柴熄灭，她无动于衷地看着吐出的青烟。\n——现在你可以转回（同频6）而了解其他情况\n`,\n\n$t1 == '15'?\n`\n见你似乎没有更多的询问，汉娜小姐简单收拾着东西，将待至冰冷的饮品一饮而尽。陷入思绪的你突然被轻轻拍了拍肩膀，汉娜小姐蓝宝石般的深邃的眼睛注视着你。“动起来吧，侦探，在温暖的炉火旁可是没有真相上门的。我有个预感，姐姐找了个挺靠谱的委托侦探，那么我先告辞了。”\n你看着推开宾馆大门的记者小姐，她那干练的穿着和极强的行动力在这个女士浓妆艳抹的时代显得有些格格不入。你向服务生喊了份简单的餐食，长久的询问已经让时针转向了五的刻度。似乎这名美丽的小姐说得不错，该让吱呀作响的身子行动起来了。\n{FormFeed}现在你可以：\n——去警局碰碰运气，请转向（同频50）\n——在宾馆里整理思