                (450)
                `,
                $t1 =='452'?`古老时期的知识淹没了你脆弱的心灵。
                哈哈!在基瓦内马，哈哈!基瓦内马独占世界!他们的敌人被摧毁。尽管基瓦内马因这些努力而贫穷，虽然基瓦内马人自己也因诅咒而发育迟缓，但他们的敌人却再无生命，被埋在无情的海底。魔法永不停止!每个基瓦内马人都是祭司!腐败的魔法!黑暗的魔法，枯萎!寒冷!冰!衰败、发育迟缓的他们再无法抵御冰川的蔓延，也无法抵御冰川带来的种族…因纽特人。无法生育。冰川。城市化为尘土!虚弱永无止境。寒冷到死，新的人类来自南方。大屠杀!基瓦内马呼唤伊塔库亚!伊塔库亚发出了他的呼唤!风行者!冰心!在风中奔跑!Y kaa haa bho ii!
                \f获得7点克苏鲁神话知识。如果你让自己挣脱，重新回归团队，转到[532]。如果你不害怕学习更多，进行理智检定，再进行极难的POW检定：如果你理智检定失败，那就失去1D6 SC;如果你的POW检定失败，则失去1D3 POW,如果你两个都失败，则转到[455];否则，转到[453]。
                (451)
                `,
