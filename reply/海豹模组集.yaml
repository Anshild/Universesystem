                (216,291,344,406)
                `,
                $t1 =='294'?`天空因雷暴云的聚集而变得昏暗。一道怒吼着的闪电划破了天空，预示着一场大暴雨。几乎同时你看到一道电光，快速落下，伴随着巨响在耳边响起。“哇!”西尔维亚说。“一定是击中了附近的某个地方!”
                的确如此。很快有烟从山上的树林中升起。
