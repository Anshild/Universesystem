            - - "{%\n$t1 == '1'?\n`“那么——旅途开始，衷心祝愿你旅途愉快。”四周浓郁的阴影淹没了你，再次睁眼，眼前已经换上另外一番景象。{FormFeed}你收到了来自电脑的任务预警，上面写着：\n**************任务预警*****************\n维稳专员 David-R-URK-1, 技术局；Joshua-R-THR-2，技术局；Edith-O-OFX-2，技术局。\n请于 1300 小时在 I-F6 总部集合。调查在居住区 Lonnie-KKD3 和 Virgil-KKD-4 的可疑的监视系统故障。住宅区坐标 F6-117/KD。\n你接受这个任务吗？\n如果接受，跳到7。\n如果不接受，跳到14。\n`,\n$t1 == '2'?\n`她持续用武器瞄准着你，直到太平间机器人和内务安全局小分队到达，抬走了 Joshua 的尸体。他们到达以后，Edith 陪着你去了部门总部，在那里你被彻底盘问了一遍，不过最后被释放了。\n跳到55。 \n`,\n$t1 == '3'?\n`Joshua 朝着 Edith 开枪了，但是没打中，却暴露了自己。Edith 开枪并且打中了，准确打中了他的双眼之间，Joshua 倒下了。Edith 转向了你，用枪对准你。Edith 展示出的精准枪法让你印象深刻。你怀疑自己能不能在被她锁定之前拿出自己的激光枪并开火。但是已经没有可以逃跑的地方了。她持续用武器瞄准着你，直到太平间机器人和内务安全局小分队到达，抬走了 Joshua 的尸体。\n跳到55。\n `,\n$t1 == '4'?\n`你瞄准了 Joshua-R 或者 Edith-O。\n如果你用自己的激光枪开火，跳到41。\n如果你有实验性杀伤设备 X324-09，你用它开火，跳到23。\n `,\n$t1 == '5'?\n`背对着 Edith-O 可不是一个好主意。Edith-O 发出了激光枪爆裂的声音。你朝着门口走了几步，然后一股灼热的疼痛从后背传到你的胸口。当你恢复意识的时候，你躺在医院里，身边是警卫员，跳到19。\n`,\n$t1 == '6'?\n`电话亭的地板上有一张脆藻片，上面有几行很小的字。写着：“Edith-O 是内务安全局的特工，消灭她。”你发现没人在看你，于是你吃掉了这个信息，继续朝着集会地点前进。\n跳到43。 \n`,\n$t1 == '7'?\n`有一个实验性的杀伤设备需要测试。你会接受任务分配给你这个设备吗？\n如果接受，跳到26。\n如果不接受，跳到44。 \n`,\n$t1 == '8'?\n`显然你什么都没打中，或者是武器坏了。你被几个熔化的塑料碎片灼伤了，跳到3。 \n`,\n$t1 == '9'?\n`内务安全局的特工很快带着类人机器人来了。他们询问你的时候，你的伤得到了他们的及时关注。你被送到了医院，你的上司来看望你，给你带来了 20 信用点的奖励和电脑的称赞。\nJoshua-R 在你的报告之后立刻被逮捕并处决了。\n记下代码 M，然后跳到55。\n`,\n$t1 == '10'?\n`你的激光枪在墙上开了个大洞。在混乱中，没人知道你打算向谁开枪。记下代码 N。Joshua朝着 Edith 开枪了，但是没打中，却暴露了自己。Edith 开枪并且打中了，准确打中了他的双眼之间，Joshua 倒下了。Edith 转向了你，用枪对准你。\n如果你向她开枪，跳到47。\n如果你收起自己的武器，跳到2。\n`,\n$t1 == '11'?\n`Joshua 显然结束了他在干的事情然后向 Edith-O 走去，后者正在大厅里用她的设备搜索中。\nJoshua-R 突然掏出一把激光枪，直直地射向 Edith-O 的脸。Edith 无声地倒下了。记录下一个代码 L 然后选择你的行动。\n如果你闪向视线外，跳到39。\n如果你拿出并准备好武器，跳到21。\n如果你问 Joshua-R 他在做什么，跳到15。\n如果你什么都不做，只是继续观察，跳到33。\n`,\n$t1 == '12'?\n`David-R 从来不是一个有说服力的说谎者。但是这次特别幸运，Edith-O 显然相信了 David 关于他刚才被工具箱“绊倒”的解释。Edith 收回了枪。记下代码 H，跳到36。\n`,\n$t1 == '13'?\n`在你打开外壳的时候，一束红色、绿色、蓝色的线散了出来。你不太记得它们原来是怎么连的了，如果你想的话，可以随便装回去，不过谁知道你用的时候会发生什么呢？记下代码 E，然后跳到50。\n`,\n$t1 == '14'?\n`不接受任务是反叛行为。再说一遍，你接受这个任务吗？ 如果接受，跳到7。\n如果不接受，跳到51。\n`,\n$t1 == '15'?\n`Joshua 转向了你，眼神中充满了狂热的光芒，“从机器中解救人类！总有一天，我们都会自由的！”然后他用激光枪对准了你，跳到33。\n`,\n$t1 == '16'?\n`你闪过了 Joshua 并穿过门口进入了走廊。Joshua 朝着你的方向又开了一枪，打中了你的手。他惊慌失措地匆忙跑走了。由于走廊挤满了狂热的人，追赶是不可能了。你受伤的手掌开始抽动。\n如果你立刻去找一个终端机，把这个事件报告给电脑，跳到9。\n如果你试图逃离这个区域，找个地方藏起来，跳到46。\n`,\n$t1 == '17'?\n`（这个时候，一般 GM 会查他的表，扔骰子决定你向 Edith 开枪的结果。这里我们就仁慈地假设 David-R 超级幸运好了。）\nJoshua 向 Edith 开枪了，但是打偏了只射中了墙。Edith 用她完美的瞄准一枪终结了Joshua。然而，由于她因此暴露在你的枪口下，你打中了她的太阳穴，她跌倒在地。于是你立刻杀死了她，记下代码 L。\n如果你试着逃走，跳到45。\n如果你自首，并声称另外两个维稳专员互相杀了对方，扔骰子（你的欺诈技能是 4）。\n如果你骰出了小于等于 4，跳到53。\n如果你骰出了大于等于 5，跳到53。\n`,\n$t1 == '18'?\n`用你的五感增强异能力，你可以看到 Joshua 正在往他的激光枪上装一个绿色的环形枪管。而绿色的枪管在 Joshua 的红色保密等级是拿不到的。你没有可以抵御绿色激光武器的装甲，Edith 可能也没有。\n如果你大声警告，记下代码 I，然后跳到30。\n如果没有，记下代码 J，然后跳到11。\n`,\n$t1 == '19'?\n`来自内务安全局的 Edith-O 把你带走羁押起来，她像电脑汇报了你的行为。现在你再也不是维稳专员了，你的故事结束了。你现在是一个低等级的、在发臭的食物桶里工作的、身上背着反叛行为记录的工人。\n电脑是你的朋友。\n`,\n$t1 == '20'?\n`你现在可以针对这个设备做出更多的决定，可以试着拆开检查它。\n如果你试着拆开的话，你需要进行一个机械工程技能检定，你的技能值是 6，扔骰子。\n如果骰出小于等于 6，跳到32。\n如果骰出大于等于 7，跳到13。\n如果你不打算这么做的话，跳到50。\n`,\n$t1 == '21'?\n`Joshua 的武器早已先准备好，他先开枪了。跳到33。\n`,\n$t1 == '22'?\n`Edith-O 抽搐翻滚着倒下了，Joshua 转过身，冲着你笑了，然后用他的激光枪朝着你开火了。记下代码 L，然后选择你的行动。\n如果你试着闪开他的攻击，并逃到大厅，跳到34。\n如果你用左手拿出激光枪并回击，跳到21。\n如果你试着靠近他跟他徒手搏斗，跳到52。\n`,\n$t1 == '23'?\n`如果你之前记下过代码 E。跳到8。\n没有的话，跳到35。\n`,\n$t1 == '24'?\n`你偷听到：“你要求获得那个东西的信息是完全不合理的。现在我可以帮你给电脑交一份报告提这个要求，但是一旦你有什么更多可疑的行动，我立刻就把你从任务中踢出去。你知道被任务负责人踢出去有什么后果吗？”\n你听到了声音慢慢走向你，你刚刚来得及从门口移开，然后当 Edith-O 和 Joshua-R 走进来的时候装作无辜的样子，跳到36。\n`,\n$t1 == '25'?\n`Joshua-R 的工具箱里没什么特别的。Edith-O 的工具箱在你触碰它的瞬间发出了嘟嘟的警笛声，隔壁房间的说话声立刻停止了。\n如果你试着用机械工程技能来停下警报，跳到37。\n如果你立刻离开房间，跳到54。\n`,\n$t1 == '26'?\n`你被分配了实验性杀伤设备 X324-09，名字是神经电击枪。它的用法跟普通的激光枪差不多，但用它瞄准所需要的技巧比激光枪更低。你会因为你的忠诚获得电脑的回报。\n在你的人物卡上记下这个实验性设备的序列号，这个设备没有使用手册。\n你要问问跟这个设备有关的更多信息吗？\n要问的话，跳到38。\n不问的话，跳到20。\n`,\n$t1 == '27'?\n`这一段并不是这个模组中的一部分。因此，如果你读到这里的话，说明你没有按照电脑的指示往下走。给你自己加一点反叛点数。\n`,\n$t1 == '28'?\n`你试图躲避 Joshua，在你快要到门口的时候，胸口传来一阵灼热的疼痛。你摔倒在地，在你眼中的光线渐渐消失的时候，你想起了小时候在走廊里玩皮球的时光。\nDavid-R 死了，Joshua-R 很快被逮捕并处决了。Edith-O 获得了一个英雄的葬礼和晚间新闻中的 10 分钟报道。\n结束了！电脑是你的朋友。\n`,\n$t1 == '29'?\n`显然，Joshua-R 有红色等级护甲，你的射击仅仅让他大吃一惊。然而，你拖住了他的时间，使得 Edith-O 一枪他脑门上开了个洞。他像个失灵的机器人一样直直地倒在了地上。\nEdith-O 收起了她的激光，向你的帮助表示感谢。然而，当你们在等待太平间机器人和内务安全局小队到达抬走尸体的时候，她还是一直盯着你。最后，Edith-O 向你承诺她会为你的忠诚协助推荐你晋升。\n记下代码 K，并跳到55。\n`,\n$t1 == '30'?\n`Edith-O 和 Joshua-R 都听到了你的喊声。Edith 拿起了她的武器，Joshua 朝着 Edith-O 开了一枪但是没有打中，Edith 找了个掩体躲开了。\n如果你闪出视线外，跳到48。\n如果你拿出并准备武器，跳到4。如果你什么都不做，继续观察，跳到3。\n`,\n$t1 == '31'?\n`David-R 的话术技能只有可怜的 1。扔骰子。\n如果扔出 1，跳到12。\n如果扔出大于等于 2，跳到49。\n`,\n$t1 == '32'?\n`你不能完全确定它的工作原理，不过你能看出来它有很大动力组件，但并没有用来设置火力值的部分。由于你没有损坏它，你信心满满地把它重新装回来。记下代码 D，然后跳到50。\n`,\n$t1 == '33'?\n`你的胸口感受到了 Joshua 的激光枪的冲击，灼热的疼痛，然后你的视线一片漆黑。某个遥远的声音对你说，“来吧，可怜的魔鬼，至少，你最后从机器中解脱了。”然后，就是完全的寂静。\nDavid-R 死了，Joshua-R 很快被内务安全局逮捕了，他被指控反叛和破坏电脑的财产。\nJoshua 很快被处决了。\n结束了。电脑是你的朋友。\n`,\n$t1 == '34'?\n`Joshua-R 的一枪打偏了。如果你能逃到门外，你就能来到挤满了人的走廊。为了能够成功闪避 Joshua-R，你需要骰一个敏捷。你的敏捷是 13，投骰子。\n如果你骰出了 13 或者低于 13，跳到16。\n如果你骰出了 14 或者更高，跳到28。\n`,\n$t1 == '35'?\n`神经电击枪释放出了能量巨大的冲击波。同时，在你来得及松手之前，你手中的设备突然急速变热并爆炸了。你全身洒满了灼热的金属和塑料碎片，投一个骰子。\n如果点数小于等于 16，且你朝着 Edith-O 开枪的话，跳到22。\n如果点数小于等于 16，且你朝着 Joshua-R 开枪的话，跳到40。\n如果点数大于等于 17，跳到8。\n`,\n$t1 == '36'?\n`“David-R？这是 Joshua-R，我是 Edith-O。”摆出了一个恐吓的姿势，Edith-O 说，“我是这次行动的负责人，你们可别忘了这一点。”\nEdith-O 让 Joshua-R 和你拿上你们的工具箱跟着她，她带着你们到达了位于坐标 F6-117/KKD 的住宅区 Lonnie-KKD-3 和 Virgil-KKD-4。她拿出一把钥匙开了门，然后把 Joshua- R 派到公共休息室去检查主部件，你被派去检查卧室的远端部件。Edith-O 核实了一下你们都在干活，然后就去用一个奇怪的设备开始搜索墙和地板。\n你可以看到另一个房间的 Joshua-R，他现在不在 Edith-O 的视线内，同时也完全没有意识到你在看他。Joshua-R 从他的连体工作服口袋里拿出了什么东西开始摆弄。\n在你这个距离应该看不清他，但是你的异能力——五感增强，使你变得有可能看清 Joshua-R在做什么。\n如果你想用异能力来观察 Joshua，跳到18。\n否则的话，跳到11。\n`,\n$t1 == '37'?\n`显然警报是没那么容易轻易关掉的。一个手里拿着激光武器的女人出现在门边。\n如果你举起双手投降，跳到49。\n如果你试着用话术为现在的情况找个借口，跳到31。\n如果你跑出房间，跳到5。\n如果你试着用武器或者徒手搏斗来攻击那个女人，跳到42。\n`,\n$t1 == '38'?\n`很抱歉，这个信息对红色保密等级不开放。\n在你的人物卡上记下代码 C，然后跳到20。\n`,\n$t1 == '39'?\n`Joshua-R 靠在门上，朝着你开了一枪，但是没打中。在他走到能够平射你的距离范围之前你没机会准备好自己的武器了。你可以闪避并逃向门外，门外是走廊，有很多人。为了能够成功闪避 Joshua-R，你需要骰一个敏捷。你的敏捷是 13，投骰子。\n如果你骰出了 13 或者低于 13，跳到16。\n如果你骰出了 14 或者更高，跳到28。\n`,\n$t1 == '40'?\n`Joshua-R 抽搐翻滚着倒下了。Edith-O 转向了你并小心地用枪对准你，但当她看见你的武器已经碎成碎片，而且你也受伤了的时候，她把枪收回皮套，并且帮你急救。她十分尊敬地对待着你，并等着内务安全局的小分队来把 Joshua 翻滚的躯体抬走。类人机器人带着你走了出去，她为你的勇敢向你敬礼，并向你保证电脑会回报你的忠诚。\n跳到9。\n`,\n$t1 == '41'?\n`你不太擅长用激光枪射击——你的技能点数只有 7，投骰子。\n如果你骰出了小于等于 7，且你向着 Edith-O 开枪的话，跳到17。\n如果你骰出了小于等于 7，且你向着 Joshua-R 开枪的话，跳到29。\n如果你骰出了大于等于 8，跳到10。\n`,\n$t1 == '42'?\n`Edith-O 拿出了武器瞄准了你。你不得不拿出自己的武器或者冲过房间。Edith-O 的第一枪打中了你的胸口，你失去了知觉倒在地板上，直到她的第二枪彻底终结了你。（由于你做出了试图攻击的行为，她认为她没有义务把你活着带回去。）David-R 死了。Edith-O 将会由于除掉了一个反叛者而获得晋升。\n反叛行为永远是划不来的。服务电脑吧！电脑是你的朋友。\n`,\n$t1 == '43'?\n`当你到达的时候，Joshua-R 和 Edith-O 不在总部会议室里，但是他们的工具箱都放在门后的地板上。你能听见隔壁有个女人尖声跟一个男人在说着什么，但是你听不清具体内容。\n如果趁着屋里没人，偷偷打开看看他们的工具箱里面有什么，跳到25。\n如果你走近一点偷听那个女人的声音，跳到24。\n如果你什么也不做，安静地坐着，等待其他维稳专员，跳到36。\n`,\n$t1 == '44'?\n`测试实验性设备是为电脑服务。电脑是你的朋友。你要再考虑一下接受分配给你这个实验性设备？\n如果接受，在你的人物卡记下一个代码 A，跳到26。\n如果不接受，在你的人物卡记下一个代码 B，跳到50。\n`,\n$t1 == '45'?\n`由于记录表明你应该在和 Edith-O 和 Joshua-R 一起任务中，所以被内务安全局的人找到也只是时间问题。这种逃跑行为已经足够被认作可以被处决的根据。\nDavid-R 被一组伏击的内务安全局特工杀死了。特工们因为及时而有效率的表现而获得了嘉奖。\n反叛行为总是划不来的。侍奉电脑吧。电脑是你的朋友。\n`,\n$t1 == '46'?\n`收到忠诚的市民的报告说看到了 KKD 地区有个手部受伤的奇怪的人，内务安全局的人很快到达并逮捕了你。电脑认为你的潜逃是充足的反叛行为证据，你被处决了。\nDavid 死了，有几位内务安全局的特工因为迅速有效率的逮捕逃亡者获得了赞扬。\n反叛行为永远是划不来的。服务电脑吧！电脑是你的朋友。\n`,\n$t1 == '47'?\n`Edith-O 有橙色等级的反射护甲。你开枪对她毫无影响，她轻轻松松终结了你。\nDavid-R 死了。Edith 由于除掉了两个反叛者收到了嘉奖。\n反叛行为永远是划不来的。服务电脑吧！\n`,\n$t1 == '48'?\n`你听到了好几声激光的放电声，然后是一片寂静。Edith 走进了你所在的房间，看到你没拿武器。她一直用武器对着你，直到太平间机器人和内务安全局的小队来运走了 Joshua 的尸体。\n跳到55。\n`,\n$t1 == '49'?\n`David-R 说自己被工具箱“绊倒”的蹩脚借口显然让 Edith-O 不太满意，跳到19。\n`,\n$t1 == '50'?\n`在你跟你的同僚维稳专员们去位于 I-F6 总部的指定集会地点的路上，一个路过的人给你打了浪漫年华秘密结社的手势，然后跟你小声耳语，“浪漫年华任务，详情去那个门开裂了的自白室。”门开裂了的自白室就在前面。\n如果你停下来进去接收信息，记下代码 F，跳到6。\n如果你不停下，接着直接去指定集会地点，记下代码 G，跳到43。\n`,\n$t1 == '51'?\n`没能接受任务是反叛行为。David-URK-1 被降级到了红外等级，然后被分配了在食物大桶工作。在你的新的等级中，拿着红色等级的装备是反叛行为，于是你的红色制服和激光枪也被没收了。\n结团了！你现在是一个低等级的、泡在发臭的食物桶里工作的、身上背着反叛行为记录的工人。\n电脑是你的朋友。\n`,\n$t1 == '52'?\n`你为了跟他徒手搏斗，必须靠近 Joshua 才行，于是你径直冲进了他的激光枪的弹幕，跳到33。\n`,\n$t1 == '53'?\n`无论讯问的人相不相信你的故事，证据都是无可置疑的。你的激光枪杀了 Edith-O。电脑判决是你犯了反叛罪，被处决了。\nDavid-R 死了。反叛行为是划不来的。服务电脑吧，电脑是你的朋友。\n`,\n$t1 == '54'?\n`你身后的门打开了，跳到5。\n`,\n$t1 == '55'?\n`你从这次任务中活下来了！\n通常情况下，你不会知道你有没有获得反叛点数，GM 会对这个信息保密。不过，为了帮助你理解 Paranoia 世界如何运转，这次你可以被告知你获得了多少点数以及点数的来源。把你记下的代码跟下面的注释列表对照就行了。\n注释列表查看跳到56。\n`,\n$t1 == '56'?\n`A 表示由于你接受了实验性设备所以没有反叛点数。\nB 表示由于你拒绝了实验性设备而获得了一个反叛点数。\nC 表示你由于询问了保密的信息而获得了一个反叛点数。\nD 表示当设备被交还给研究设计局（R&D）的时候你的操作被发现了。由于你为了获得红色保密等级不应该获得的信息，擅自对设备进行了非法检查，你增加了一个反叛点数。\nE 表示你为了获得红色保密等级不应该获得的信息，擅自对设备进行了非法检查，同时破坏了实验性装备。你被罚款 20 个信用点，然后被判定增加了一个反叛点数。\nF 和 G 都表示没人看到你跟秘密结社的成员联络，也没人发现自白室里的信息。\nG 表示你没有遵守秘密结社的指示，结果是你丢了秘密结社中的等级和特权。\nH 什么都不是——不过你看到有个代码的时候稍微慌了一下，不是吗？\nI 表示因为你的迅速行动保护了一个受到电脑信任的特工，所以反叛点数总数减去 1。然而，在后来的认定中发现，没有异能力的人可能无法知晓另一个房间发生的事情，所以你由于被怀疑拥有未登记的异能力而获得了一个额外的反叛点数。\nK 表示 Edith 虽然对你有所怀疑，但她还是觉得你试图帮助她的行为值得称赞。你的反叛点数总数减 1。\nJ 对你的反叛或者奖励点数都没有影响，毕竟你不能因为你不知道的东西（Joshua 的隐藏武器）而受到指责是吧。\nL 表示，由于 Edith 的死——不管是不是你杀的，甚至不管你知不知道你要杀她，如果你没看自白室里的信息的话——你从你的秘密结社获得了一个 IOU。 \nM 表示，由于你的及时行动导致了一位反叛者的逮捕，因此你获得了提拔。恭喜你，David-O-URK-1！ \nN 表示 Edith 无法确定你打算向谁开枪，她向电脑汇报了你的可疑行为，以及你没能协助她工作这一事实。你获得了一个反叛点数。\n`\n%}"
