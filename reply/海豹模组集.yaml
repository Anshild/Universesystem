                \f接着从一个Y形装置中射出一道冰冷的光束。这个光束螺旋着擦着你的耳边飞过。一些荒谬的念头迫使你站在原地，触摸你的耳朵。它完全麻木了。其他采矿者向你移动，举起他们的工具。
                终于，幻想被打破了。你腾挪着冲回你的同伴身边，大喊：“怪物!”
