                (213、292、313)
                `,
                $t1 =='315'?`与哺乳动物和植物不同，鸟类种群中是燕鸥、猫头鹰和鹅类等你非常熟悉的物种。当你穿过一片长满了莎草、灯心草和芦苇的沼泽地时，你想到《纳德尔曼的失落之地》一书中可能不会为鸟类增添多少新物种。
