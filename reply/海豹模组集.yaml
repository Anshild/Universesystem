98\n原模组下载地址https://cnmods.net/#/moduleDetail/index?keyId=2245\n作者主页：https://wiki.cnmods.org/doku.php?id=user:%E9%9B%BE%E7%BF%8E\n`,\n$t1 == '82'?\n`\n一年后，你将事务所搬到了考文垂德地区，生意一如在阿卡姆般冷冷清清。\n“叮铃铃——”在你摁掉闹铃后的半小时，你的被子被猛地掀开。\n“明明都没什么生意……”\n你嘟囔着嘴，看着无趣的报纸。\n“侦探先生，劳驾动一动你的身子吧，你可重了整整 6 磅，迟早你那臃肿的肥肉会把你卡在壁炉里的。”\n面前的女子正娴熟地清点随身物品，急匆匆地下了楼，甚至下意识把你的大衣披在了身上，随后就是楼下的开门和关门声。\n你将相框仔细擦拭了遍，将营业牌挂在了门外。身穿睡衣的你打着哈欠开始对付起了桌前热腾腾的早餐。\n大约这就是嘴硬心软的记者小姐和身为侦探的你的日常吧。\n【剧终】\n{FormFeed}\n游戏书下载地址：https://cnmods.net/#/moduleDetail/index?keyId=2798\n原模组下载地址：https://cnmods.net/#/moduleDetail/index?keyId=2245\n作者主页：https://wiki.cnmods.org/doku.php?id=user:%E9%9B%BE%E7%BF%8E\n`\n%}"
