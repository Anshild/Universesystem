                \f你的小型探险队乘坐火车进入加拿大中北部，然后承包了一艘船前往大奴湖(GreatSlave Lake),沿着马更些河(Mackenzie)前往麦当劳堡(Fort McDonald),在那里，加拿大皇家骑警的前哨站将是数千平方英里的高山、湖泊、针叶林和沼泽中的唯一文明社会力量。
                \f麦当劳堡是猎人和土著人的交易场所。进入北汉尼纳河谷的最佳路线是沿着马更些河的西支流，乘皮筏艇向上游，到达你所寻找的支流的河口。我们为你准备了一艘制作精良的单舱皮划艇，以及夏季旅行所需的所有基本装备。
