            - - "{%\n$t1 == '1'?\n` \n你睁开了眼睛。眼前是夜间的小巷。\n的确，你本该在做别的什么事情才对。更何况，你从未来过这样的小巷。\n这里是什么地方？完全没有印象。路灯也像是快要坏掉了似的，一闪一闪的。\n——想要回忆之前的事请，转向cocktail2\n——环顾四周，请转向cocktail3\n`,\n\n$t1 == '2'?\n`\n你试着回想在这之前的事。\n……对了，你在注视着屏幕。是智能手机、平板、电脑，又或是其他什么。\n你隔着屏幕看着那些文字，然后眼睛因疲劳而酸胀起来。等到闭眼后再次睁眼时，\n就已经身处于小巷之中。\n——环顾四周，请转向cocktail3\n——已经想到该去的地方了，请转向cocktail4\n`,\n\n$t1 == '3'?\n`\n环顾四周，在昏暗的小巷中、月光的照耀下，可以看到一间酒吧。\n你能喝酒吗？但除此外也找不到其他地方，只能去那里了吧。\n——前往酒吧请转向cocktail4\n`,\n\n$t1 == '4'?\n`\n向酒吧走去，你能看到在出入口的那扇门上，挂着『本日出租』的牌子。\n你会就此转身，还是会去看看里面的情况呢？\n不管怎样，在你付诸行动前，门内传来了声音。\n“啊啊，你终于来了。快进来吧。”{FormFeed}\n你会对此感到犹豫吗？但就目前来说，也没有其他可以去的地方。\n下定决心后，你将手搭在门把手上，一口气打开。\n——进入酒吧，请转向cocktail5\n`,\n\n$t1 == '5'?\n`\n你会为此感到吃惊吧，还是大吃一惊。如果是直觉敏锐的人，能够猜到这一幕吗？\n你一进酒吧，在眼前站着一个人，一个你熟悉的人。\nTA穿着调酒师般的服装，站在吧台后方，也许还会朝你微微一笑。\n“坐在那里，我们慢慢谈吧。我一直都期待着见你一面。”\n“呐——我的{$t玩家}？”{FormFeed}\n在那里的是，刚才「你」为了开始这个模组而选择的「调查员」。\n由「你」创造、由「你」操纵，「你」的「{$t角色名}」。\n——坐到座位上，请转向cocktail6\n`,\n\n$t1 == '6'?\n`\n只要你坐到座位上，{$t角色名}便会开心地露出微笑。\n不、根据{$t角色名}的性格，或许并不是那样。\n但如果你慎重，并忠于模组指示，他、或者她便不可能会对你抱有强烈的敌意。{FormFeed}“那么，难得你来，该招待些什么比较好呢？”\n“这里是酒吧，此刻的我已经成年了，你呢？能喝酒么？”\n——能喝酒，请转向cocktail7\n——不能喝酒，请转向cocktail8\n`,\n\n$t1 == '7'?\n`\n“这样啊，那么来一杯美味的鸡尾酒如何？”\n“唔，什么时候掌握了这门技术？谁知道呢。”\n“毕竟如果连你都不知道的话，我又怎么可能会知道呢。”{FormFeed}\n这么说着，{$t角色名}在吧台后方熟练地调制着鸡尾酒。\n然后，将调制出的、淡黄色的澄澈液体倒入玻璃杯中，递给了你。{FormFeed}\n“帝王菲士（Imperial Fizz），酒语是『愉快的谈话』。\n好不容易才见一次面，还是开心一点比较好吧？”\n——接下来，请转向cocktail9\n`,\n\n$t1 == '8'?\n`\n“是吗，既然这样的话……”\n{$t角色名}取出的不是酒，而是将其他饮品注入了玻璃杯中。\n液体在暖色系灯光的照耀下，反射出偏红的紫色，闪闪发光。{FormFeed}\n“是蓝莓汁哦。要是不喜欢的话，那还真是抱歉啦。”\n“关于蓝莓的花语有很多呢。”\n“像是『有收获的人生』『有意义的人生』『善意』之类的，都很有名。”\n“我想让这段时间变得有意义。”\n——接下来，请转向cocktail9\n`,\n\n$t1 == '9'?\n`\n在你接过对方递来的饮品后，{$t角色名}也将同样的液体注入玻璃杯中。\n而后，举杯啜饮一口，朝你微微一笑。\n你会喝吗？当然，就算不喝也不要紧。毕竟你是{$t玩家}，不用在意这样那样的事情。{FormFeed}\n“通常我都是被你提问的那个人。”\n“所以这次我想要向你提问。”\n“反正这段记忆好像会在天亮的时候消失，可以吧？”\n“呐，说起来，你到底是怎么知道『这个世界』的呢？\n这个叫做『克苏鲁神话』的、不可思议的世界。”\n——做出你的回答，然后转向cocktail10\n`,\n\n$t1 == '10'?\n`\n要是你回答的话，{$t角色名}就会表现出符合{$t角色名}的反应哦。\n就算你没有喝饮料，谈话也会继续进行下去。{FormFeed}\n对于{$t角色名}来说，这也许是比『日常生活』要更加安定的时光。\n那是当然的。因为在他、或是她的日常生活中，总是伴随着邪神的存在。\n但如果没有它，或许根本连存在都不会有。{FormFeed}\n“你为什么创造了「我」？”\n“还有像「我」一样的人吗？”\n——做出你的回答，然后转向cocktail11\n`,\n\n$t1 == '11'?\n`\n{$t玩家}应该持有多个“{$t角色名}”吧。\n根据时间和场合，选择适合这个场景的人。{FormFeed}\n也许会有和这次被选中的{$t角色名}有关的{$t角色名}。也许有人经历了非常艰辛痛苦的命运。\n其中或许会有已经失去了生命的，亦或是丧失了理智的。\n当TA知道他们也是被你、或你的同类创造出来的时，这个{$t角色名}会有什么想法呢？{FormFeed}\n“你对我了解多少？”\n“家人？友人？恋人？过去、未来、现在……”\n“你究竟了解我到什么程度呢？”\n“嘛，无论如何，你所想的都是我的『人生』。”\n——做出你的回答，然后转向cocktail12\n`,\n\n$t1 == '12'?\n`\n音乐悠扬流淌，静谧的爵士乐令人心旷神怡。{FormFeed}\n……{$t角色名}认为的『自己的人生』，是从何开始，又从何结束呢？\n从零开始，一切都由你创造的。\n自我究竟从何而来，又消失在何处呢？\n这种事情，作为真实存在的你是不可能明白的。\n但在某时，{$t角色名}的「自我」会向你倾述……有这样的瞬间也不是不可能呢。{FormFeed}\n“原来是这样啊。”\n“你让我活着是为了什么呢？”\n“因为不会死，所以只是活着而已？”\n——做出你的回答，然后转向cocktail13\n`,\n\n$t1 == '13'?\n`\n忽然，“咔啦咔啦……”的，传来了熟悉的声响。那是许多PL都耳熟能详的声音。\n将视线投向声源，{$t角色名}在吧台上滚动着三枚常见的六面骰。{FormFeed}\n3d6。这样的话语在脑海中一闪而过。那是在制作角色卡时，必须要转动的骰子。\n难道说{$t角色名}是在知道这一点的情况下，转动了骰子吗？还是说仅仅只是放在那里？\n你能读懂现在没有被你操纵的{$t角色名}的情感吗？{FormFeed}\n骰子的点数是3、6、1……合计是10。\n“你想让我活下去吗？”\n——做出你的回答，然后转向cocktail14\n`,\n\n$t1 == '14'?\n`\n“呐。”\n在你回答完问题后，{$t角色名}拿起了一个小瓶子。\n虽然是空的，但看起来既通透又美丽，是个塞着软木塞的小瓶子。\n“看着。”\n“现在我要给这个瓶子施点小魔法。”{FormFeed}\n{$t角色名}为了不让你看到那个瓶子，而用手将其捂住。\n然后，当那只手再放下去的时候……瓶子内盛满了夜空。\n“瞧，仔细看。”\n{$t角色名}将那个瓶子拿到你的眼前。仔细观察的话……云、还有星星，都在移动着。\n倘若只是单纯的影像的话，是不可能会有这么真实的立体感的。\n简直就像是将天空直接切割一部分下来……那是难以被称作为人造品的夜空。\n“看起来就像是真的一样吧？”\n{$t角色名}盯着那个瓶子这么说道。那侧脸……是愉快的呢？还是悲伤的呢？\n又或是别的表情？你看到的{$t角色名}会是怎样的表情呢？{FormFeed}\n“但这不是真的。是仿造品。”\n“是人造出的、仿造品。”\n“……我们也是一样的吧。”\n“明明和你们一样，有过去、有未来、有家庭、有朋友、有恋人、有伙伴。”\n“有感情……有体温……”\n“如果受伤了，会感到疼痛。”\n“呐，{$t角色名}……不、”\n他、她，在呼唤着你的名字。\n“哪里是「真实」，哪里又是「虚假」？”\n“在你们「人类」的角度看来，我们这些「人」又是什么呢？”\n——做出你的回答，然后转向cocktail15\n`,\n\n$t1 == '15'?\n`\n无论你给出怎样的回答，{$t角色名}都会将其接受的。\n那也是理所应当的。因为本就是作为“{$t角色名}”诞生的他们，并没有能否定自己{$t玩家}的力量。{FormFeed}\n但有时候，他们会同你说话。\n我不想那么做。我是这么想的。\n苦恼、痛苦、艰辛、悲伤......\n肯定会有向你拼命诉说着各种情感的瞬间。\n如果你重视那个角色的话，就一定会的。\n在这时，作为「伪物」诞生的他们，也许会变成「真物」。{FormFeed}\n“……天快亮了。”\n{$t角色名}恋恋不舍地这么说着，将瓶子递给你。瓶中的天空开始被朝霞染红。\n“很快乐哦。虽然我会忘记这一夜。”\n“但请你一定要记住。”\n“对我来说，只有你才是我的{$t玩家}。”\n——接下来，然后转向cocktail16\n`,\n\n$t1 == '16'?\n`\n那么，回家的路该怎么走才好呢？你从座位上站起，走向出入口的门。\n喝酒了吗？如果喝了的话，现在应该能够感受到一种愉快的醉意吧。\n不知何时，门把上被系上了白色的丝带。\n想要转动门把手的话，就必须要先解开这条丝带。\n因为不是难解的系法，所以想解开的话马上就能解开吧。{FormFeed}\n将目标定位初始值25，再加上根据你选择的PC通过的模组数量*5来进行检定。\n例如，至今为止已经通关了五个模组的话，就是25+5*5=50。\n使用.ra模组数量*5来进行检定\n——成功，请转向cocktail17\n——失败，请转向cocktail18\n`,\n\n$t1 == '17'?\n`\n在解开丝带的瞬间，白色的丝带上浮现出灰色的文字。\n「直到再见的那一天。」\n——写着这样的内容。\n你很清楚。那是你的{$t角色名}的字迹。{FormFeed}\n然后，你穿过了门扉。\n——接下来，请转向cocktail19\n`,\n\n$t1 == '18'?\n`\n你解开丝带。解开它实在太过容易了。\n就像是黎明到来前，两人交谈的那段时间一样。不留任何痕迹。{FormFeed}\n然后，你穿过了门扉。\n——接下来，请转向cocktail19\n`,\n\n$t1 == '19'?\n`\n……你是在哪里读到这个模组的呢？\n是在自己的房间吗？寝室、工作场所、电车中，和谁一起？还是一个人？\n是用什么来阅读这篇模组呢？是智能手机、平板还是电脑？\n难道说是在网吧，又或是别的什么地方吗？\n是什么都无所谓。因为那是你的日常生活。{FormFeed}\n你活在「这边」的世界，他们活在「那边」的世界。仅此而已。\n翻过这一页后，迟早也会忘记这个模组吧。\n那也是理所当然的。这就够了。\n但是……如果你想要盛满蓝天与鸡尾酒的小瓶的话，很容易就能入手。\n因为那是{$t角色名}给予{$t玩家}你的一点小礼物。{FormFeed}\nEND 蓝天与鸡尾酒的小瓶\n没有SAN值报酬。对于在这个模组内发生的事情，{$t玩家}不会有任何记忆。\n——接下来，请转向cocktail19\n`,\n\n$t1 == '20'?\n`\nAF：小瓶\n盛满天空与具有「对明日的期待」这一含义的凯匹罗斯卡（Caipiroska）的小瓶。\n酒绝对不会变质或腐坏。\n这是你所拥有的AF，你可以在喜欢的时机把这个交给喜欢的“{$t角色名}”。\n而得到它的{$t角色名}终有一日将从调查员隐退，过上平和的日常生活。但只能在模组结束后使用。\n这本就是{$t玩家}必须拥有的权利，但以此为契机和王牌被赠送。\n调查员也是，在作为棋子之前，也是一个人。\n`\n%}"
