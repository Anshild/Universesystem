                \f北汉尼纳河比西支流域更湍急。它的泛滥平原被沙洲、浮木山丘、带状岛和扎根于泥中的枯树林所阻塞。水流将它们全部带向下游，就像警告让你回头的箭头。
                西尔维娅转向你的向导。“查理?你的族人住在这个地区吗?”
