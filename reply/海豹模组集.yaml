                (203,239)
                `,
                $t1 =='249'?`它们在空中掠过，长着奇怪翅膀的轮廓。你在有光的空地上看到了更多令人厌恶的细节：真菌布满了脸，扭动的身体。
                获得1点克苏鲁神话知识。进行一次理智检定：如果失败，则失去1D6 SC。然后，转到[253]。(248)
                `,
                $t1 =='250'?`这个地区充满了恐怖。
