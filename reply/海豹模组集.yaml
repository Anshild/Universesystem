                (529)
                `,
                $t1 =='375'?`法医声称你开枪打死了人!他们认为这是一个不幸的当地人，因为他的畸形，被赶出了他的居住地。事实上，你的头骨来自于与智人完全不同的物种，这一证据是不可信的。
