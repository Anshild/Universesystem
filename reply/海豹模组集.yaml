                (228)
                `,
                $t1 =='282'?`西尔维娅毫无生气地躺在诺曼的怀里。而诺曼看起来像一只在进食时受惊的野兽。这一描述是合适的，因为女孩被可怕的、一个嘴巴大小的伤口咬出了鲜血。
                转到[328]。
                (236)
                `,
                $t1 =='283'?`“教授!”诺曼恐惧的声音把你从睡梦中惊醒。“看!”西尔维娅不再昏迷。她蹲在毯子上，脸扭曲得可怕。
