            - - |-
                你需要铅笔、草稿纸、骰子，还有一本《克苏鲁的呼唤规则书》(第七版)。不要从头到尾阅读完这本书!每个条目都有编号，在它的末尾可以找到要去哪里以及下一步要读什么的说明。你可能需要做出选择或尝试一次技能检定，看看会发生什么。有时，你可能会被要求记录一个关键词，以标记你冒险中的重大事件。不要将这些关键词带入到后续的再次游戏中。
                你的角色可能需要处理身体或精神创伤。虽然这些不会结束你的冒险，但它们会打断你正在做的事情。如果你受了重伤，失去知觉，记下你当前的条目编号，忽略当前文本，立即转到191。如果你陷入临时疯狂，转到39;陷入不定时疯狂，请转到364;对于永久疯狂，请转到550。这些提到的内容将记录入你的角色表中。
                \f【纳德尔曼博士】（你操纵的角色）
                你可以把纳德尔曼博士设定为男性或女性。在你开始探险之前请确定这一点。
                你是马萨诸塞州阿卡姆密斯卡托尼克大学最年轻的终身博士。你是文化人类学新领域的冉冉新星；就连你的欧洲同行也对你连篇累牍的学术文章印象深刻。你的理论令人兴奋，你的课堂总是爆满，你的学生崇拜着你。之前对你履历的考察非常轰动，足以吸引媒体对大学的广泛关注，尤其是人类学系。关于你的专业，有大量私人捐赠的传言比比皆是。你的系主任和学院管理人员经常邀请你吃饭。
                纳德尔曼博士的调查员角色表见第109页。你可以在纳德尔曼的职业技能中分配360点，这些技能包括：人类学、历史、图书馆使用、博物学、其他语言、母语(英语)、心理学和说服。你的角色必须至少有75%的人类学知识。
                纳德尔曼博士还有180点个人兴趣技能点可供使用。根据你的喜好分配这些，但对于实地考察，你可能需要考虑枪械(步枪/霰弹枪)、导航、驾驶(船)和生存(丛林)。
