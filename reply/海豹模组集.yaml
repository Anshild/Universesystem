                {%
                $t1 =='0'?`【主角背景】
                你，纳德尔曼博士，长期以来一直对北美的史前历史，特别是北方的大森林着迷。加拿大的荒野和亚马逊盆地一样依旧未被开发，狩猎者、猎皮者和淘金者讲述了该地区居民令人毛骨悚然的故事。当然，他们也讲述了可怕的恶魔和其他奇异幻想的故事。现在是时候给大森林带来严谨的学术观点了。隐藏在那里的真相无疑比任何旅行者的故事都迷人。
                \f一年多来，你一直在向你的院系申请资金以在合适的夏季探索加拿大西北地区。现在，你的资金终于得到批准，你准备在春季学期结束时开始旅程。你的许多研究生学生都很想去，但你只能带上三个。
