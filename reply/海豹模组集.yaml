                (158,604)
                `,
                $t1 =='462'?`那天晚上你在睡梦中瑟瑟发抖。西尔维娅把你摇醒，她的呼吸在空中模糊。“纳德尔曼博士!"她急切地说。“是伯纳德!他受伤了!”
