                要解开她并迫使她离开这个危险的地方，转到[578]。要让她留在原地，转到[513]。
                (576,583)
                `,
                $t1 =='578'?`你割断了她的绳索，强迫那个年轻女孩和你的队伍一起离开。西尔维娅把她拉到一边，低声和她说着话。
                掷1D10:如果结果是偶数，转到[579];如果结果是奇数，则转到[580]。
                (577)
                `,
                $t1 =='579'?`跟着你们走了几英里后，女孩的眼睛变得清澈明亮，她不再希望被森林中的神秘恶魔带走。感谢你们对她的施救，她谈话间变得轻松，你们通过她了解了很多北汉尼纳山谷的许多故事和神话。
                她对白人的城镇很好奇，也对该地区很了解。
                如果你想结束你的旅程，陪她转到[593]。如果你想探索更多，她会自己找到去麦当劳堡的路；转到[600]。
                (578)
                `,
                $t1 =='580'?`这个女孩仍然面有愠色。诺曼建议为了她自己的安全把她绑起来。西尔维娅瞪了他一眼，让他安静下来，并向这个少女提供了一些你们的食物。
                在诺曼守夜的时候，你被叫醒了。“很抱歉，教授。女孩离开了。我不到五分钟前搜寻过她。她一定是没有吭声。”
                你不打算在夜间在树林里拦截一个偷偷摸摸的本地人。而且你们似乎不太可能找到她。你耸耸肩，接着回去睡觉了。
                转到[513]。
                (578)
                `,
                $t1 =='581'?`你们一行人听从了劝告，矮身形躲在一棵倒下的大树后面。几个人从西面的树林走出来。你能认出好像是图特那族的土著猎人；不过，他们的步枪是老古董了，装备没有你以前见过的图特那人的那么好。查理谈到过一个被遗弃的群体，这些人可能就是她提到的那些人吗?
                要走出隐蔽处迎接他们，转到[560]。要继续隐藏，让团队中潜行技能最低的人进行潜行检定：如果成功，转到[582];如果失败，转到[584]。
                (569)
                `,
                $t1 =='582'?`猎人从你们身边经过。他们举止十分冷酷。要秘密跟踪猎人，转到[586]。要折回并查看他们之前的行踪，转到[583]。
                (581)
                `,
                $t1 =='583'?`沿着这些人留下的新鲜踪迹折回很容易。它们把你们带回附近的一个山谷。往下看去，你看到一个可怜的场景——一个少女被绑在一棵树上，好像要饲喂狼群。
                这似乎与图特那人的性格格格不入。她能有什么用呢?
                转到[577]。
                (582)
                `,
                $t1 =='584'?`沿着这些人留下的新鲜踪迹折回很容易。它们把你们带回附近的一个山谷。往下看去，你看到一个可怜的场景——一个少女被绑在一棵树上，好像要饲喂狼群。
                这似乎与图特那人的性格格格不入。她能有什么用呢?
                转到[577]。
                (582)一只蜜蜂飞了起来，在一名队友的脸上趴了下来，后者本能地赶走它，发出了响动，路过的猎人们无疑注意到了。你们的躲藏失败了。
                如果要走出去和平地面对这群人，转到[561]。如果尝试逃跑，转到[585]。如果你们仍然有步枪，并希望展示其作为威胁，转到[590]。
                (581)
                `,
                $t1 =='585'?`你拉着诺曼和西尔维娅急转。你们三个冲向树林深处。恐惧驱使你们穿过树林，让你们的速度没有因为追猎者对地形的了解而相差太多。
                进行幸运检定：如果你成功了，转到[147];如果失败，转到[575]。
                (584)
                `,
                $t1 =='586'?`你的队伍小心翼翼地沿着离开的图特那遗弃一族的足迹前进。追踪这些老练的山民并不容易。
                为你的团队中潜行技能最低的成员进行一次潜行检定：如果成功，转到[587];如果失败，转到[570]。
                (582)
                `,
                $t1 =='587'?`走了几英里后，猎人们扎营安顿。他们中的一些人带着步枪去了树林，可能是为晚饭去狩猎。其他人则在火旁休息。
                `,
                $t1 =='588'?`当你和你的一行人出现时，猎人们惊讶地抬起头来。你和平地举着手。
                进行人类学检定：如果你成功了，转到[589];如果你失败了，转到[560]。
                (587)
                `,
                $t1 =='589'?`一个看起来是猎人队长的人眼神充满警惕地回复了你的问候。简短的询问交流会让你了解到，正如你所猜测的那样，这群人是狩猎队的一部分。他们的讲话混合了他们的母语，夹杂着英语单词。他们回避与白人政府的接触，从不去当地城镇。不过，他们确实羡慕你的步枪。
                如果你想离开荒野，这个队伍会引导你们来换取你的枪支。
                要进行交易，转到[433]。要感谢他们，但拒绝并继续探险，转到[513]。
                (588,592)
                `,
                $t1 =='590'?`面对你们的枪支，猎人们犹豫不决。
                掷1D6:如果结果为1-4,转到[591];如果
                结果是5-6,则转到[592]。
                (584)
                `,
                $t1 =='591'?`一名猎人将步枪举到他的面前向你们开火。其他猎人也开始射击。
                总共有1D6+2名有步枪的猎人攻击你。
