                (226,484)
                `,
                $t1 =='277'?`不知是碰巧还是狡猾，这生物的踪迹通向一条小溪。尽管你尽力了，你还是不能找到足迹。诺曼沮丧地踢了一脚石头堆。
                要寻找西尔维娅，转到[292]。要放弃你的努力，回归文明，转到[278]。放弃追寻，但探索这个失落的山谷，转到[38]。
                (226,484)
                `,
                $t1 =='278'?`失去西尔维娅而你无力拯救她，你和诺曼沿着通往外界的淹没的悬崖边缘行进，内疚感弥漫于心中。
