            - - |-
                一般来说 Paranoia 跑团需要一个 GM 和一个或多个玩家。
                这里有一种特殊形式的单人游戏，允许你一个人玩，这个单人跑团是用来向你介绍 Paranoia 世界的。
                每个小节描述了一个场景，然后要求你在两种或多种路线的行动中做出选择。
                当你选择后，跟着指示跳到对应的小节。跑团的过程中，你可能偶尔需要记下特定的代码。把它们写在纸上，跑团结束就会向你解释这些代码的作用。
                当你跑完以后，不妨再来一遍，试试不同的选择会造成什么样不同的结局。
                就算你已经成功通关了，也可以试试再跑一遍看看愚蠢的选择会发生什么。
                这个单人游戏可以帮助你了解一个维稳专员在为电脑执行任务的时候会遇到什么样的问题、做出什么样的决定和得到什么样的后果。
                为了这个单人游戏，你需要铅笔、纸、一个骰子，以及一个为 David-R-URK-1 准备的示例人物卡。
                如果已准备好从头开始游戏，请输入“paranoia1”
