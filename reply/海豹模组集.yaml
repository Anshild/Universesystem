                一个被认为已经灭绝的动物的战利品将为你大学的同事提供可靠的证据。但如果留在这个神奇的山谷里，你可能会让你的学生面临严重的危险。
                若要离开山谷而不寻找战利品，转到[158]。若要寻求证据，转到[608]。
                (605)
                `,
                $t1 =='608'?`你和其他人沿着失落的山谷前进，进入其中心的青翠草地。
