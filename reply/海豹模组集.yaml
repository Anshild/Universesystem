                (395,396,400,614,627,628,635)
                `,
                $t1 =='292'?`你和诺曼寻觅着西尔维娅经过这条路的迹象。但是，当你的注意力全在踪迹上时，你可能会被注意到。
                进行追踪和幸运的组合检定：如果都成功了，转到[290];如果两个都失败了，转到[315];如果只有追踪成功，请转到[289];如果你只有幸运成功，那转到[314]。
                (277)
                `,
                $t1 =='293'?`你、诺曼和西尔维娅避开了史前地貌的危险。一个碎石斜坡，可以让你们以危险性较小的方式从山谷下行。
