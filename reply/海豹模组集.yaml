                (82,188,190,233,241,251,278,361,
                442,466,467,534,565,594,596)
                `,
                $t1 =='280'?`在试图保持与北汉尼纳平行行进时，你和诺曼被迫穿越很多温泉和峡谷。在某个拐弯处，你听到了奇怪的嗡嗡声。
