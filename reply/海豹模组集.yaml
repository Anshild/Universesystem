                (37)
                `,
                $t1 =='499'?`在灌木丛旁，一个男性矮人受伤躺在地上，身上有一个霰弹枪子弹大小的洞。令人难以置信的是，他还活着。当你走近时，他试图爬走。你试着用最熟悉的加拿大方言进行简单的沟通，但这个小家伙只发出嘶嘶声。他是一个惊人的标本，奇怪的灰色皮肤，夸张的五官，手和脚呈现奇怪的长度比例。如果他不是独一无二的，他的种族比你所研究过的任何种族都更偏离常见数据标准。他的物种甚至可能不是人类。
