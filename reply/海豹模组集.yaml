            - - |-
                【玩家伙伴】
                纳德尔曼探险队由五人组成。你有当地导游查理·福克斯坦(Charlie Foxtail)的帮助，还有伯纳德·埃布斯坦(Bernard Ebstein)、西尔维娅·戴维森(Sylvia Davidson)和诺曼·福尔克纳(Norman Falkner),他们都是你大学的研究生。他们的调查员表见frost656~659
                如果你需要做一次技能检定，而你的一个同伴在场并且醒着，你可以选择让他们来代替。例如，查理在聆听的技能点数很高；只要查理能帮忙，你就可以用她的技能代替纳德尔曼的。不过，你只能尝试一次技能掷骰。
                如果发生战斗，你的同伴可能会帮助你。尽可能均匀地将伤害分摊到你的队伍。纳德尔曼博士可能会选择采取额外的措施来保护学生。除非文本考虑到同伴死亡的可能性，否则在战斗中同伴的生命值不得减少到零以下。如果同伴的生命值降低到零，那么他们就会失去知觉，如果纳德尔曼在战斗中幸存下来，他们会苏醒。
                你需要注意，同伴可能消失或死亡。
                \f【使用幸运点数】
                建议你使用可选规则的“消耗幸运”规则。这个规则允许你花费你的幸运点数来改变技能或属性掷骰的结果。你可以以1比1的比例来改变结果(例如，为了调整49的结果，使结果等于
                你的技能45,你将花费4点幸运),然后从你当前的幸运总数中扣除所有花费的幸运。谨记，你不能用幸运点数来改变伤害骰、幸运骰、理智骰或理智损失(SC)骰的结果。
                你可能会花费纳德尔曼博士的个人幸运点数，在一次失败的技能检定中获得成功；然而，在树林里恢复幸运的机会很少，而且你可能会有需要检定幸运的地方，所以这样做是有风险的。
                \f【战斗】
                在战斗中，你的对手的战斗技能将以以下格式记录：“50%(25/10)”。50%是常规攻击掷骰，而括号中的数字(25:10)表示一半(困难)和五分之一(极难)成功等级，以确定谁赢得了战斗回合(即谁获得了更高的成功等级)。在条目中，被击中受到的伤害都以掷骰表示(掷骰指定的伤害骰，以确定博士或同伴损失的生命点数)。如果纳德尔曼博士受到的伤害，将导致重伤和/或昏迷，请查阅以下条目，纳德尔曼博士的角色表上也有注明。
                ·重伤导致昏迷：转至191。
                \f【陷入疯狂】
                除了受伤和死亡的威胁，在探险过程中，你的理智可能会受到奇怪和难以理解的事情的影响。记录纳德尔曼博士的理智数值，并按正常情况计算理智损失。在某些情况下，陷入疯狂的结果直接出现在条目文本中；否则，在任何其他情况下，如果你达到临时疯狂、不定时疯狂或永久性疯狂的临界值，请根据情况查阅以下条目，然后从那里继续，以下条目编号也会在纳德尔曼博士的角色表上注明。你不需要记录你同伴的理智值。注意，恐惧症和躁狂症在本冒险中没有使
                用。
                ·临时疯狂：转至39。
                ·不定时疯狂：转至364。
                ·永久性疯狂：转至550。
                \f【条目格式】
                各条目按次序编码为[1]到[654]。所有条目提供的信息都遵照以下格式。
                1.条目编号使用大号粗体数字。
                2.详细描述场景或简要述说情况。
                3.之后，条目可能会指示你前往某个编号的条目或让你做出一个选择、掷骰，这可能导致不同的结果。
                4.每个条目末尾的一个或多个带小括号的数字是“回溯号”,其表示你可能从那些条目来到当前条目(如有必要，可以原路回溯)。
                5.偶尔你会遇到【剧终】字样。这意味着你的调查员注定要失败，冒险结束了。当然，有时这意味着你赢了，但并不常见。如果冒险失败，请再次尝试。
              - 1
    - enable: true
      conditions:
        - condType: textMatch
          matchType: matchExact
          value: 冰霜独行后记
      results:
        - resultType: replyToSender
          delay: 0
          message:
            - - |-
                在被Chaosium邀请为其新版《冰霜独行》的发行写一篇文章后，我很高兴地接受了邀请，但我迟迟难以下笔。我预见到了一个可能的问题，因为我在1984年制作了这款游戏。那是35年前的事了!要想让过去的记忆和感觉重现生机，需要一些精心准备。
                我一直在从事其他项目，包括小说和桌面游戏，但我已经很久没有把注意力投向洛夫克拉夫特主题了。但作为一名作家，我对洛夫克拉夫特的小说和游戏有着深厚的渊源。我已故的哥哥菲利普·约翰·拉赫曼(Philip John Rahman)和我为H.P.L.游戏做出了一些基础性贡献，制作了第一款出版的克苏鲁神话相关的现代风格奇幻角色扮演游戏。我们在1980年和1981年发表在《飞水牛的魔法师学徒》杂志上的两篇文章(《洛夫克拉夫特变体规则》和《克苏鲁神话中的怪物》)中完成了这项早期工作。我是游戏方面的“专家”,菲利普
                是H.P.Lovecraft的学者。
                \f我们推了一块巨石，它一直在滚动。令我们惊讶的是，当桑迪·彼得森(Sandy Petersen)发表了他的《克苏鲁的呼唤》设计笔记(《不同的世界》,第19期，1982年2月)时，他表示《洛夫克拉夫特变体规则》一文帮助他处理了克苏鲁风格遭遇的情感方面的机制。他将我们的“情绪稳定”理念融入到他的游戏系统中，将其标签改为“理智”。事实告诉我们，这一概念是奇幻角色扮演的里程碑之一。事实上，Chaosium非常感谢Phil和我的贡献，官方将我们列为在未来几年内免费获得所有《克苏鲁的呼唤》版本的名单。这些都是巧妙的扩展和补充，真的非常棒。
                \f在那之后，我继续为《克苏鲁的呼唤》本身做贡献。我的作品出现在《克苏鲁伴侣》(Chaosium,1983年)中，其中我介绍了两位引人深思但被忽视的神进入《克苏鲁的呼唤》游戏。一个是古神加塔诺托亚(Ghatanothoa,其活动似乎在波利尼西亚最为明显),另一个是由科林·威尔逊(Colin Wilson)创造的英国著名的失落种族：罗伊戈尔(Lloigor)。整个《伴侣》随后被纳入下一版本的《克苏鲁的呼唤》规则书中。
                1984年下半年，我从明尼苏达州明尼阿波利斯市辞职，计划于1985年1月初到美国邮政局上班。我从求职压力中解脱出来，利用剩下的空闲时间开始了一项新的创意项目。这就是《克苏鲁的呼唤》(Call of Cthulu)的单人冒险，当时的标题是《独抗温迪戈》(如今的《冰霜独行》)。
                \f有人可能会疑惑：你是如何为这场特殊的克苏鲁游戏选择主题的?事实上，H·P·洛夫克拉夫特的继承者奥古斯特·德雷斯创造了一位神话中的神，名叫伊塔库亚(Ithaqua,1933年首次出现)。正如我所看到的，伊塔库亚，一个伟大的古神，可以用他的邪恶能量感染那些误入他神力领地的人。然后，他们将退化成畸形的、超自然力量的食人族——这是一个相当可怕的前景!
                \f但为什么我要把一个洛夫克拉夫特的故事放在加拿大北部这样一个不寻常的地方?在构思一个单人冒险的场景时，我曾想远离发生过许多早期神话故事的典型地点。身为明尼苏达州人，我天生就喜欢大森林(尽管事实上，我几乎没有见过大森林。我从未深入过加拿大，明尼苏达州的针叶林在一百多年前就被伐木富商所砍伐)。
                \f我用我的阅读和想象构建出一个幽闭恐怖的故事，讲述一次到北方大森林科学探险的故事。很快，我勾勒了另一个北方的传说，南汉尼纳山谷的传说。
                \f关于后者，我在大学期间第一次了解了这些令人毛骨悚然的故事，在当时流行的几本“奇怪的事实”书中。他们谈到了西北地区的一个真实的地方，一个带有一些可怕传说的野生河谷。这些故事中最令人寒心的是，到野生地区的游客被发现被斩首或直接失踪。
                我的兄弟菲利普和我分享了很多创造，他对这些传说甚至比我更感兴趣。在那之后，他偶尔谈到要亲自去参观山谷，到了20世纪80年代，他终于去了，结果发现令人恐惧的汉尼纳实际上是加拿大国家公园保护区。真倒霉，这听起来不太吓人。我想写一个几乎无人知晓，人们害怕去的地方。因此，为了我的故事，我不得不虚构南汉尼纳，保留所有关于它的邪恶轶事，但将它转换成一个野生的、避而远之的地区。我把名字从南汉尼纳改成了北汉尼纳。请放心，我那迷失而又邪恶的北汉尼纳绝对不是国家公园!
                至于剩下的：要我说，我们已经把所有认为合适的东西都装进了冒险中。有人在寻找失落的山谷吗?我喜欢失落的山谷。热衷于大脚野人?我喜欢大脚怪。既然你已经玩过了，提起神秘的基瓦内马就不会是一个大剧透了。这些类人生物是菲利普和我的共同想法。
                \f那是在大学或不久之后。我们在锻炼我们的想象力，因为作为美国人，我们对洛夫克拉夫特对古代北美的了解太少感到失望。洛夫克拉夫特给澳大利亚带来了“伟大的种族”,给南极洲带来了“古老之物”。但新世界呢?菲利普和我创造了一个古老的类人种族，名为基瓦内马，他们是失落的穆大陆和亚特兰蒂斯大陆的同时代种群，通过邪恶的巫术，在两个对手的灭亡中幸存下来，从而弥补了这一缺陷。
                \f因此，这部单人冒险书于1985年由Chaosium出版。我期待着做更多这样的冒险来支持《克苏鲁的呼唤》,但事实并非如此。出版后不久，Chaosium通知我们，他们已决定不扩大其单人冒险系列。但是，最近，时代潮流改变着。目前Chaosium官方已选择重新振兴单人冒险系列。我们对此非常期待。
                直到最近，我们欣慰地发现，这场冒险的记忆并没有完全从游戏文化的脑海中消失。我有一种预感，当我正努力写下这篇后记时，我在YouTube上搜索了一下，看看这个标题是否会出现在网站上。的确如此。在那上面可以找到两段视频，其中一段在加拿大的荒野中进行了39分钟的冒险。希望，这部全新的《冰霜独行》将唤
                醒很久以前第一次玩它的人的美好回忆，也为今天的一代年轻人创造新的回忆。
                ——格伦·拉赫曼，2019年3月
