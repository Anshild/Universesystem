          message:
            - - "剧本作者：YunT\n邮箱：yuntwork@163.com \nQQ：2898949241\n游玩此模组需要你对 COC 规则有最基本理解（即快速开始规则），比如说如何进行技能检定，如何进行理智检定，战斗轮的基本流程，角色的重伤/濒死/死亡判定。\\n《46》的故事发生在 1995 年 7 月英国某个小镇，你的目标为解开关于《名字》的谜题，让自己脱离险境，甚至可以进一步阻止毁灭世界的灾难。《46》属于人类于群星闪耀时战役的第 5.4 章，和战役关系联系不大，可以单独游玩。\\f\n①本模组有预设卡也可以自己车卡，虽然由于 PC 不存在预设性别。所以，有的行为会看起来较为男性化，又有一些较为女性化。战役 PL/KP 建议使用预设卡。\n②NPC 存在阵营好感度系统，且初始为 0。\n③并非所有选项都会直接跳转，存在某些秘密选项/线索引用，会用德尔塔: δ\n例如：段落#42 你在街边卖报纸的时候的顺便还买了一份肉狗，你将热狗放到油包纸袋中，或许能在什么地方用得上它，获得δ【热狗】，用到这条δ时在你所在的条目号上加上 10。获得δ【报纸】，用到这条δ时在你所在的条目号上加上 38。\n\\f④难易度选择：假如你在本模组中反复去世，无数次达到宇宙的终极答案，感觉难度过高的话，可以尝试降低难度，比如在下一次游戏中继承上一盘的线索δ，或者把初始携带的现金变为500 英镑。\n⑤游玩过程可能会多次经过同一个段落，并且投掷骰子检定，有些检定可以进行多次，有的则只能进行单次，关于如何进行此项检定，请游玩者自行把控。\n⑥本模组没有写出大成功或者大失败这样小概率事件的检定结果，假如玩家不想浪费一个大成功/大失败，或是想增加游戏性，可以将大成功视为：下次检定获得一个奖励骰，将大失败视为：下次检定获得一个惩罚骰。\n⑦假如游玩过程中 PC 陷入了不定疯狂，无论 PC 当时在干什么，都请跳转至 248。\\fPC 陷入了不定疯狂，无论 PC 当时在干什么，都请跳转至 248 \\fPC 陷入了不定疯狂，无论 PC 当时在干什么，都请跳转至 248\n进入游玩，请发送“stars0”开始剧情。"
