                (315)
                `,
                $t1 =='370'?`当你和两个学生穿过一片草地时，雷雨云在拉姆山上空聚集。你们朝着一棵高大、宽阔的树走去寻求遮蔽，路上有许多据考证已经灭绝的动物群，它们以茂盛的开着花的草为食。
