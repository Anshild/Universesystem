                (276,292)
                `,
                $t1 =='290'?`你默默地引导诺曼穿过史前景观。突然，你听到树林中发出噼里啪啦的响声，把他拉着蹲下。有什么大东西正在树林中移动。它映入了眼帘。
                为你和诺曼进行理智检定；失败将失去1D6
