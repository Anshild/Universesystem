                (173,248,253)
                `,
                $t1 =='251'?`西尔维娅已经被冲出可触的距离。你用力游泳，到达诺曼附近。你抓住了他的皮夹克领子，把他拖到了岸上。
                诺曼因溺水失去了2D8的生命值。如果他还活着，你可以进行急救：如果你成功，恢复他的1D3点生命值。如果诺曼死了，转到[67]。如果他活着，你们开始返回麦当劳堡；转到[279]。
                (227)
                `,
                $t1 =='252'?`你站起来举起手臂，这种姿势在大多数文化中都是非攻击性的。采矿者关掉矿物清洗机器，放下它们，举起了一种奇怪而扭曲的Y形状的装置。
