                $t1 =='242'?`你登上皮筏艇，顺流而下。在你的下一个休息点，到处都是鱼和野味。一顿美餐让你恢复了健康。最后，你来到了查理·福克斯塔称之为“水流分叉之地”的那个危险的河段。
