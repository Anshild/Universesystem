                (551)
                `,
                $t1 =='274'?`你拿出的物证能说服所有人，但最有偏见的对手除外。大学对这个话题进行了严肃的讨论。电台和报纸的记者们吵着要采访你。
                转到[272]。
                (431)
                `,
                $t1 =='275'?`各种形状和大小的植物在你周围生长。你没能辨识出哪一个毫无疑问是史前的。你记得为这次探险花了多长时间才获得资金；申请另一次探险也许需要一些实际证据。
                要空手返回阿卡姆，请转到[216]。要进一步探索，请转到[551]。
                (225)
                `,
                $t1 =='276'?`当你沿着一条浅溪蹬水行进时，你几乎丢失了那个生物的踪迹，但你经验丰富，不会被这样的困难难倒。你和诺曼跟着踪迹上了高地。
                当你攀爬时，你发现脚印变得更新鲜了。
