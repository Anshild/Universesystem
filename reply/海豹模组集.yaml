                (448)
                `,
                $t1 =='450'?`这种现象令人难以置信!你感觉好像你站在一扇高高的窗户里，从那里你可以看到过去、现在和未来的巨浪相互撞击。
                在所有的混乱之下，传递着真实信息和感觉的波流。当你摇摇晃晃地站着时，你试图将自己协调到这些波流中，让知识溢满你痛苦的心灵。然后，你“看”到。。。
                古老的年代。这个地方。一群身材瘦高、皮肤灰白、面容残忍的男人。他们不是原始人。他们要更古老，非常古老的那种。他们有一个名字，基瓦内马。他们的精神行于大地上。他们自古统治。这片大陆是他们的。
                \f他们用强大的魔法和可怕的力量来保卫它。亚特兰蒂斯的船只在燃烧；穆大陆的祭司无处立足。世界有三种力量，而基瓦内马并不是最弱的。哦，邪恶!基瓦内马的统治如万古长夜般黑暗。他们有神；他们向可怕的神灵献祭。透特!犹格·索托斯!扎索格!莎布·尼古拉丝!噩梦中的名字。每个神都有一座寺庙。在他们领地的中心，有一座像石头轮子一样的神庙。伟大的风行者的神庙!伊塔库亚!呃，亚，亚-亚，亚。。。
