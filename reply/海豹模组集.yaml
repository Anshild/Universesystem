                $t1 =='447'?`查理剧烈的抖动让人不寒而栗。她撕裂的嘴唇动了动，仿佛被强制违背自己的意愿说话。“如果你想知道Ten a-ranide知道什么,那就去Ten a-ranide去的地方!说出保护咒语!Hallapjora-syojatar!”
