                (243)
                `,
                $t1 =='245'?`你把西尔维娅从地上抱起来。她的眼睛茫然地凝视着你。诺曼设立了营地，试图创造一个温馨的环境。在床上休息了几个小时后，西尔维娅似乎从阴影中走了出来。
                掷1D10:如果结果是偶数，转到[324];如果结果是奇数，则转到[237]。
                (244)
                `,
                $t1 =='246'?`诺曼和西尔维娅都能保持冷静，同时凝视着混乱的场面。你们中已经远去的人为他们感到骄傲。
