                (607,636)
                `,
                $t1 =='609'?`山谷的炎热使西尔维娅感到疲惫。你让她先休息，让伯纳德陪着她，而你和诺曼继续探查。
                大约两个小时后，你们俩回来后发现一个令人震惊的场面。伯纳德躺在之前休息的小树林里，他的头被钝物打碎了。尸体旁边躺着一个血迹斑斑的木头。你疯狂地寻找西尔维娅，但找不到她。相反，你发现了一些巨人的脚印。
                要带领诺曼离开山谷，转到[278]。要追踪踪迹，希望找到西尔维娅，转到[484]。
                (645)
                `,
                $t1 =='610'?`你们几个的声音和气味导致寻找猎物难有结果，但你在泥土中发现了应该是大型猫科动物捕食者的痕迹。你让诺曼和西尔维亚待在山脚下，而你带伯纳德去狩猎。你可以看出伯纳德抑制着孩子气的兴奋。
                你们追踪了猎物一个小时，希望能大杀一场。进行聆听检定：如果你成功了，转到[611];如果失败，转到[615]。
                (608)
                `,
                $t1 =='611'?`你听到了沙沙的脚步声，随机旋转你的步枪口。一只长着剑齿獠牙的巨型狮子跳到你上方的岩石狭缝，张着大嘴跳了起来。
                向剑齿狮开了一枪。如果伯纳德带着武器，他也可以开枪。如果你们中的任何一人成功通过困难的DEX检定，就可以射出第二枪。
                \f如果你对狮子造成至少12点的伤害，你就杀死了它，拿到它的头作为战利品。记录关键词背水并转到[613]。如果你造成的伤害少于12,转到[612]。
                (610)
                `,
                $t1 =='612'?`你本能地躲开，狮子从你头上跃过。它巨大的爪子埋在伯纳德的胸膛里。它攻击了另一个目标。
                伯纳德受到1D10点伤害。你可以再向狮子开枪一次。如果你现在已经累积造成了12点伤害，你就杀死了它，并将它的头作为战利品；记录关键词背水。否则，狮子会杀死伯纳德并逃掉。
                如果伯纳德幸存下来，你可以进行急救给他恢复1D3的生命值。然后，转到[613]。如果伯纳德死了，转到[614]。
                (611,615)
                `,
                $t1 =='613'?`现在是你们四人离开山谷的时候了。转到[158]。
                (611,612,618,620,625,633,636)
                `,
                $t1 =='614'?`你为伯纳德的死感到悲伤。但现在，你必须决定是继续探索山谷，还是带两个幸存的学生出去。
                要进一步探索，转到[551]。要离开山谷，转到[291]。
                (612)
                `,
                $t1 =='615'?`直到剑齿狮子弹跳起来，你才听到它的动静。转到[612]。
                (610)
                `,
                $t1 =='616'?`雷鸣般的兽群逼近了你们。但这群野兽越来越稀疏了。
                为诺曼、西尔维娅和你自己进行CON检定。由于你们的先见之明，每个人都享有奖励骰。如果每个人都成功了，转到[344]。如果你失败了，会承受2D10点伤害；如果你活了下来，转到[347]。如果你成功了，但诺曼和西尔维娅都没通过，转到[356]。如果只有诺曼一个人没通过，转到[482]。如果只有西尔维娅没通过，转到[520]。
                (370,619)
                `,
                $t1 =='617'?`山谷内有着绿草如茵的草地，成群的有蹄哺乳动物在草地上食草，而食肉动物则躲在草丛，希望捕获一个年迈、幼小或虚弱的猎物。
                尽管你在古生物学方面的知识有限，但看到这些生物还是让你惊讶。不需要专业知识就可以了解到，这里如今还存在着古早时期的马、骆驼、野牛以及大象、犀牛和没有现代近亲的野兽。
                \f伯纳德面前高高的草丛中出现了一个身影。你瞥见那是一只大型鹿体积的无峰骆驼，它毫无疑问是被食肉动物从草地上赶出来的。伯纳德冲动地举起步枪开火。野兽痛苦地叫了一声，然后挣扎而行。伯纳德不想失去他的猎物和你们所需要的证据，于是在后面狂奔跟着。
                \f他没有意识到自己的开枪声像霹雳一样落在平原上的动物中间。它们惊恐的叫声在空中回响，接着开始踩踏。当伯纳德意识到他正站在一群长角野牛的冲锋路上时已经太晚了。他需要在折返的路上闪避和赛跑。
                \f尽管他很危险，但你不能停下来帮助他。你们都处于危险之中。只有附近的树林可以躲避撞角、鹿角和蹄子组成的潮水。你们其他人跑到了树上，感觉大地有点像地震。
                让伯纳德进行DEX检定：如果他成功了，转到[618];如果他失败了，转到[619]。
                (608)
                `,
                $t1 =='618'?`恐惧让都市人都可以步履敏捷。当你爬上低垂的橡树枝时，诺曼俯下身子。他抓住伯纳德的胳膊，把他拽到了树枝上。踩踏事件持续发酵，但你们这群人就这样在树上安然无恙。
                看来，似乎没有必要对伯纳德的鲁莽行为进行训诫。
                要放弃探索这个危险的地方，转到[613]。要停留一段时间，转到[645]。
                (617)
                `,
                $t1 =='619'?`伯纳德的尖叫声在你身后持续了不到一秒钟，就被淹没了。你瞥了一眼后面，再也看不到他了。
                转到[616]。
                (617)
                `,
                $t1 =='620'?`山谷中心的草地是许多本该已灭绝的食草动物的家园。使用步枪可能会引发踩踏。如果你要拿到战利品，你需要一些手段。
                你把你的团队部署在树林中，并占据一个可以俯瞰一片草地的位置。
                \f傍晚时分，这些动物已经失去了对不同寻常的人类气味的警惕。终于，你的耐心获得了回报。一只黑白相间的小羚羊，显然在北美其他地方不存在，它冲向你附近的区域。鬣狗咬住了它的腿。当一对强有力的下颚咬住这只动物的脚跟时，它倒下了。其余的鬣狗猛扑上去，撕扯着肉。
                \f几枪小心地把鬣狗赶走。这种噪音让其他更远的食草动物跑了起来，但并没有发展成兽群踩踏。
                你和其他人从树上爬下来，拿到了战利品。这就是你想让同伴感受到的欣喜。
                记录关键词背水。转到[613]。
                (608,645)
                `,
                $t1 =='621'?`为了寻找你们大发现的实物证据，你的团队离开了山谷的底部，爬上了一个个多岩石、树木繁茂的山丘。
                \f突然有东西出现，在你一直沿着跟踪的猎物踪迹前方。你吸一口空气。这是一种有蹄野兽，一种黄褐色的动物，比你见过的任何动物都更像羚羊。但它有六个Y形状的角，沿着头部两侧长出。如果你把这个生物的头带回社会，没有人会质疑你的发现的重要性。
                \f当第一次闻到不熟悉的气味时，六角羚羊就沿着小路闪转腾挪起来。你的团队苦苦追逐。几秒钟后，伯纳德被一根枯枝绊倒，并严重出血。
                看到追逐是徒劳的，你们其他人停下来帮助伯纳德站起来。他的脚踝扭伤了；如果他放轻松的话可能就不会受这么重的伤了。但他不会那样就是了。
                “教授!看!”诺曼指着山脊。你惊讶地凝视着：巨大的、毛茸茸的猿人。
                进行理智检定：如果你成功了，转到[623];如果你失败了，转到[622]。
                (645)
                `,
                $t1 =='622'?`这次探险你承受了很大的压力。你说不出是什么让你如此震撼于巨型猿人。
                失去1D6理智。如果你保持着理智，转到[623]。如果你陷入临时疯狂，转到[646]。如果陷入不定时疯狂，则转到[364]。
                (621)
                `,
                $t1 =='623'?`这次探险你承受了很大的压力。你说不出是什么让你如此震撼于巨型猿人。
                失去1D6理智。如果你保持着理智，转到[623]。如果你陷入临时疯狂，转到[646]。如果陷入不定时疯狂，则转到[364]。
                (621)凭借意志的坚持，你振作起来。但伯纳德没能如此。他吓坏了，以受伤的脚踝一瘸一拐地走开。
                要跟随他，转到[624]。要与诺曼和西尔维娅站在一起，像对待原始人一样迎接这些生物，请转到[626]。
                (621,622)
                `,
                $t1 =='624'?`你们三个跟着伯纳德。由于他一瘸一拐，你们很快就能超过他。身后的猿人被你散发的恐惧气味所煽动，纷纷追赶你们。尽管它们的体型巨大，但它们行动迅速。你必须利用地形来对付他们。
                进行潜行检定：如果你成功，转到[625];如果你失败了，转到[628]。
                (623)
                `,
                $t1 =='625'?`你注意到山体边缘一个狭窄的山道。在搀扶下，伯纳德也能够通过。然而，对猿人来说他们有点太笨重了。他们沮丧地咕哝着，离开了。你们一行人沿着小路回到了山脚下的草地。
                放弃探索山谷，转到[613]。继续探索，转到[645]。
                (624)
                `,
                $t1 =='626'?`猿人们小心翼翼地沿着山坡前进。它们是完全直立的，像人一样，如果忽略它们发达的肌肉，还有尖竖的头毛。当他们靠近时，你开始咳嗽。他们的体臭令人难以忍受。
                你多年的研究展现了平息和安抚北美野人的技巧。
                进行人类学检定：如果你成功了，转到[627];如果你失败了，转到[629]。
                (623)
                `,
                $t1 =='627'?`野人靠近中没有表现出攻击姿态。你屏住呼吸，让他们像好奇的孩子一样盯着你的脸，用笨拙的手指触摸你的衣服。他们带着困惑的表情，也许无法判断布料是否是一种奇怪的彩色皮肤。几分钟后，这些生物失去了兴趣，慢慢离去了。
                \f西尔维娅和诺曼凝视着对方，眼中充满了惊讶。这是他们所期待的实地探险经验，是将理论转化为实践的真实案例。你只希望你能把他们带回密斯卡托尼克大学，看看这经历对他们的学业有什么影响。
                过了一会儿，你想起了寻找伯纳德，但失落的山谷似乎吞噬了他。
                要想在没有他的情况下进一步探索，转到[551]。要离开山谷，转到[291]。
                (626)
                `,
                $t1 =='628'?`“啊!”伯纳德哭喊道。野人把他向后拖，把他扔倒在地。他们用粗棍和大石猛砸他。伯纳德显然必死无疑了。
                西尔维娅似乎要回去帮忙了。你和诺曼把她拉走了。趁着猿人攻击伯纳德时，你们逃到了下面草地的安全地带。
                对伯纳德可怕的死亡深感悲痛，你必须做出决定。
                要继续探索山谷，转到[551]。要离开，转到[291]。
                (624)
                `,
                $t1 =='629'?`无论你做了什么,它都刺激到了野人。他们抓住了你、西尔维娅和诺曼，把你们都拖进了山里。
                不久，你们到达了他们的营地。他们似乎对任何艺术或工艺都一无所知，包括火。这里有皮毛和羽毛的痕迹，还有前一餐的残骸，除此，别无他物，这可能是猿人们的休息站。
                他们把你们推到一块岩石下，在外围派了几个大块头的男性猿人看守。当你评估形势后，你开始希望自己刚才和伯纳德一起离开了。
                转至[644]。
                (626)
                `,
                $t1 =='630'?`边用眼睛搜寻着实物证据边穿过草地时，你的团队被一个巨大的阴影吓了一跳，阴影滑过你周围的草地。你抬头望去，从它巨大的展翼猜测它可能是一只存世的巨型秃鹫。但它不是。
                进行理智检定：如果失败，则失去1D6SC;如果仍你保持理智，转到[631]。如果你临时疯狂，转到[646]。如果不定时疯狂，则转到[364]。
                (608)
                `,
                $t1 =='631'?`你上方的生物是一种与人类一样高的真菌类甲壳动物!数十条扭动的四肢在它的身下面乱动着。
                似乎注意到了你，它立刻抓出一个奇怪的装置。一片寒冷射击到了你脚下的地面。草地因霜冻而变白。你被攻击了!
                获得1点克苏鲁神话知识。要想寻找掩体，转到[637]。要想站起来战斗，转到[632]。
                (630)
                `,
                $t1 =='632'?`你们在这里太易受到攻击了。你唯一的希望就是还击。
                那些带着步枪的同伴可以进行一次理智检定：如果成功，他们可以开火；如果没有，他们只能目瞪口呆地看着这只会飞的生物。
                获得1点克苏鲁神话知识。在所有射手射击一次后，如果有两次或更多的射击击中该生物，请转到[633]。如果没有，转到[634]。
                (631)
                `,
                $t1 =='633'?`受了致命伤的飞行生物迅速螺旋上升，又坠入草地。你的团队走近并检查了它的怪异、残缺的身体。你把它几个部分分割成战利品，然后匆忙离开山谷。然而，在你到达出口之前，你就发现这只动物的四肢在你的背包里已经融化成了一滩粘稠的液体。
                获得1点克苏鲁神话知识。每个成员获得1D6
                SC。要离开山谷，转到[613]。要搜索更多，转到[645]。
                (632)
                `,
                $t1 =='634'?`这只生物进行了一次低空俯冲，用武器猛烈射击轰炸着伯纳德，然后滑翔着离开。
                你冲向伯纳德，他躺倒在地上。他的眼睛睁得大大的，结满了冰。
                获得1点克苏鲁神话知识。让伯纳德进行CON检定：如果他成功了，转到[636];如果他失败了，则转到[635]。
                (632)
                `,
                $t1 =='635'?`你、诺曼和西尔维娅把伯纳德带到林间空地的庇护所，试图让他暖和起来。这没有什么作用。他进入昏迷状态，在黄昏时没了呼吸。
                那天晚上你没怎么睡觉。你还活着的同伴也辗转难眠。天一亮，你们就把伯纳德埋进了空地里。
                要继续探索山谷，转到[551]。要离开山谷，转到[291]。
                (634,640)
                `,
                $t1 =='636'?`寒流并没有像你担心的那样严重地伤害伯纳德。在附近空地的庇护所处，他暖和了身体并恢复了体力。你可以进一步探索。但神秘的飞行生物可能会回来，你能冒这个风险吗?
                要探索山谷，转到[645]。要离开山谷，转到[613]。
                (634,639)
                `,
                $t1 =='637'?`当你们四个人奔跑的时候，这个生物似乎盯上了伯纳德。
                获得1点克苏鲁神话知识。给伯纳德进行闪避检定：如果他成功了，转到[639];如果他失败了，转到[638]。
                (631)
                `,
                $t1 =='638'?`那生物武器的光束正好击中伯纳德的背部。他哽咽地大叫了一声，摔倒在地。飞行生物掉转目标，将武器对准了西尔维娅。
                给西尔维娅进行闪避检定：如果她成功了，转到[640];如果她失败了，转到[641]。
                (637)
                `,
                $t1 =='639'?`这只生物的最后一次射击正好擦伤了伯纳德。他摔倒了。但有什么东西让飞行生物停止了攻击。它在树梢上滑翔着离去。
                转到[636]。(637)
                `,
                $t1 =='640'?`攻击者在最后一刻改变了主意，停止了追击。你看着它在树梢上滑行飞走，然后你们冲向伯纳德予以救助。
                转到[635]。(638)
                `,
                $t1 =='641'?`西尔维娅来不及发出一声，就在生物射击的冰冻能量下倒下了。你和诺曼跑到了树林中，躲在树冠最茂密的一丛那里。
                一等到飞行生物看起来离开了，你们就回到树林边缘，而西尔维娅和伯纳德的尸体已经消失了。
                要和诺曼一起探索山谷，转到[213]。要离开山谷，转到[361]。
                (638)
                `,
                $t1 =='642'?`伯纳德失足了!这一刻，他陷入了湍急的水流中。你准备跳下水去，但伯纳德在水中抓住了岸边岩石，并拽着稳住了身形，他浑身湿透，但安然无恙。
                转到[605]。
                (91)
                `,
                $t1 =='643'?`水流突然把伯纳德冲走了!当他消失在巨浪之下时，他的哭叫声消失了。
                让伯纳德进行游泳检定：如果他成功了，转到[92];如果他失败了，转到[110]。
                (91)
                `,
                $t1 =='644'?`你注意到野人对西尔维娅的态度与对你和诺曼不同。他们把她从你们中挑出来，让她在营地里随意走动。你鼓励她这样做。北美野人的幼崽或害羞或顽皮地靠近她。
                当西尔维娅回到你和诺曼身边时，你在想，这种状况是否会对你们有利。
                进行INT检定：如果成功，转到[387];如果你失败了，转到[389]。
                (629)
                `,
                $t1 =='645'?`经过这次的死里逃生，你知道你必须带领学生离开这个山谷。但为了探险有所回报，你将再次尝试寻找实物证据。
                要进入山区，转到[621]。要坚持狩猎草原上的动物，转到[620]。要对两者分队探查，转到[609]。
                (633,636)
                `,
                $t1 =='646'?`你一定是晕倒了。你不太记得为什么。现在是黄昏。更糟糕的是，你的队友们没了影子。你喊着学生的名字，但没有人回答。相反，你听到了史前夜行猎食者可怕的叫声。
                当早晨来临，你仍然独自一人时，你失去了希望。
                转到[365]。
                (622,630)
                `,
                $t1 =='647'?`一名30多岁的男子从废墟中走出来。他饱经风霜的西装和凌乱的胡须表明他在森林里待了几个月，但他的眼睛很锐利。他看了伯纳德、西尔维娅和诺曼一眼。他咧嘴一笑，走到你面前，有力地握手。
                “纳德尔曼博士，我想。你做到了，教授。你在这里做到了。我的名字...是杰克逊·埃利亚斯。”
                纳德尔曼的远征结束了。【剧终】。
                (彩蛋，杰克逊是克苏鲁的呼唤快速入门作者之一)
                `,
                $t1 =='648'?`突然，你周围的树林丛中都出现了小矮人。一阵飞镖雨射向你的队伍身上。你边还击边大叫，尝试有秩序地组织学生们撤退。
                伯纳德呼喊，手里拔出插在胸前的飞镖。他摔倒了，你赶紧去救他。他的四肢僵硬，手指张开。飞镖一定是有毒的。你不能留下来，也不能背上他。
                转到[113]。(131)
                `,
                $t1 =='649'?`诺曼和西尔维娅跑向你，你很欣慰能看到他们仍然活着、健康。但当你意识到你的预期发生了这样的变化时，你的心也一点点下沉。
                掷1D10:如果结果是偶数，转到[650];如果结果是奇数，则转到[463]。
                (171)
                `,
                $t1 =='650'?`诺曼说：“上一分钟伯纳德还躺在火边，不省人事，就像你离开他时一样。下一分钟他就不见了。我们顺着他的足迹来到了河边。据我们观察，足迹没入了水中，却没有出来。”对该地区的搜索证实了他的说法。你没有更多办法了。
                要回归文明，转到[324]。要继续探索，尽管发生了这样的事，则转到[600]。
                (649)
                `,
                $t1 =='651'?`因为突然爆发的异种狂暴，查理的脸扭曲了。凭直觉，你把炽热的火棍戳进了她那颗被诅咒的心脏。
                被刺穿的风行者咯咯作响，摇摇晃晃，接着摔倒了。当你察看的时候，她的身体在收缩，塌陷在自己身上，很快就只剩下了骨头。
                \f诺曼和西尔维娅靠近，他们被骚动惊醒。他们盯着地上的骨头。你决定不告诉他们完整的故事。早上，你们将开始漫长的跋涉，返回麦当劳堡。
                为战胜风行者恢复1D6点SC。转到[54]。
                (212)
                `,
                $t1 =='652'?`当你临近离开这个地方的崖间裂隙时，战斗热潮的肾上腺素已经消退为深深的疲惫，你必须拖着脚让它们保持运动。也许这就是为什么你感觉不到一直在跟踪你们的狼。
                带领着团队，当它发动攻击时，你已经走过了它的藏身之处，当它爆发时，你大喊着。诺曼向后摔倒，而这只\f巨大的恐狼把西尔维娅扑倒，并咬破了她的脖子。
                你和诺曼很快就反应过来，开始进攻。你们迅速杀死了恐狼。但对西尔维娅来说还是太晚了。
                你把她埋在山谷入口的附近。转到[278]。
                (287)
