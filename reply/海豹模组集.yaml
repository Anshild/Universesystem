                (279)
                `,
                $t1 =='281'?`随着挣扎的声音，伯纳德从灌木丛中冲了出来。他帮你用皮鞋鞋带绑住那个矮小的男人。
                稍后，在营地，你彻底检查了这个人。他脸上的色素似乎是不自然的单色，好像他的血液没有红细胞。他的手臂比正常人的手臂长，手指像爪子一样。他戴着一些用动物骨骼制成的小首饰(你认为是)。
                每一次与小个子沟通的尝试都失败了。他沉默寡言，接近迷离。
