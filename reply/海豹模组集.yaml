                (458)
                `,
                $t1 =='461'?`你的队伍开始深入，每个人都去了自己的小帐篷。伯纳德首先值夜。在一个树枝垫子上，你扔下鸭绒铺盖。在此基础上，你又盖了一张被子。你习惯性地在合眼前看了最后一眼；营地已经安顿好了，一切都已就位。
